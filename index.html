<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3b5bdb">
<title>《计算机操作系统（慕课版）》刷题</title>
<style>
  :root{
    --bg:#eef2f8; --card:#ffffff; --ink:#1f2a37; --muted:#64748b;
    --accent:#3b5bdb; --accent-soft:#e8edff;
    --ok:#0f9d58; --ok-soft:#e6f6ec; --bad:#e0483f; --bad-soft:#fdecea;
    --line:#e2e8f0; --shadow:0 10px 30px rgba(23,42,84,.08);
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       background:linear-gradient(180deg,#eef2f8,#e6ecf6 40%,#eef2f8);color:var(--ink);
       -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:880px;margin:0 auto;padding:24px 16px 120px}
  header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
       -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
       border-bottom:1px solid var(--line);padding:14px 16px}
  .topinner{max-width:880px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .brand{font-weight:800;font-size:17px;letter-spacing:.2px}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
  .chip.g{background:var(--ok-soft);color:var(--ok)}
  .chip.r{background:var(--bad-soft);color:var(--bad)}
  .chip.n{background:#eef1f6;color:var(--muted)}
  .refresh{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;
       color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;
       font-family:inherit;cursor:pointer;transition:.15s}
  .refresh:hover{border-color:#b9c4ea;background:var(--accent-soft)}
  .refresh:active{transform:scale(.97)}
  .refresh svg{width:15px;height:15px;flex:0 0 auto;transition:transform .4s ease}
  .refresh:hover svg{transform:rotate(-180deg)}
  .bar{height:6px;background:#e3e9f3;border-radius:999px;overflow:hidden;margin-top:12px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5b76f7,#3b5bdb);transition:width .35s ease}
  .modes{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;
       margin-top:18px;box-shadow:var(--shadow)}
  .mode{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:10px;font-weight:700;color:var(--muted);
       font-size:14px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  .mode .cnt{display:inline-block;min-width:20px;padding:0 5px;border-radius:999px;background:var(--bad-soft);
       color:var(--bad);font-size:11px;margin-left:3px;line-height:17px}
  .mode.active{background:var(--accent);color:#fff}
  .mode.active .cnt{background:rgba(255,255,255,.25);color:#fff}
  .posline{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
       padding:26px 26px 22px;margin-top:12px}
  .card.in-r{animation:inR .22s ease}
  .card.in-l{animation:inL .22s ease}
  @keyframes inR{from{opacity:.35;transform:translateX(26px)}to{opacity:1;transform:translateX(0)}}
  @keyframes inL{from{opacity:.35;transform:translateX(-26px)}to{opacity:1;transform:translateX(0)}}
  .qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .qno{font-weight:800;color:var(--accent);font-size:15px}
  .badge{font-size:12px;font-weight:700;color:#8a5a00;background:#fff3d6;border-radius:6px;padding:3px 8px}
  .badge.plain{color:var(--muted);background:#f1f3f8}
  .badge.k{color:#1d4ed8;background:#e6edff}
  .stem{font-size:17.5px;line-height:1.75;font-weight:600;white-space:pre-wrap;word-break:break-word}
  .stem .blk{color:var(--accent);font-weight:800;border-bottom:2px solid var(--accent-soft);padding:0 4px}
  table.qtable{border-collapse:collapse;margin:14px 0 4px;font-size:13.5px;font-weight:500;max-width:100%}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.qtable td,table.qtable th{border:1px solid #cbd5e1;padding:6px 10px;text-align:center;white-space:nowrap}
  table.qtable tr:first-child td{background:#f1f5fb;font-weight:700}
  .media img{max-width:100%;height:auto;display:block;margin:14px auto 0;border:1px solid var(--line);
       border-radius:10px;background:#fff}
  .opts{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);background:#fbfcfe;border-radius:12px;
       padding:13px 15px;cursor:pointer;transition:.15s;font-size:16px;line-height:1.55;
       -webkit-user-select:none;user-select:none;touch-action:manipulation}
  .opt:hover{border-color:#b9c4ea;background:#f5f8ff}
  .opt .k{flex:0 0 26px;height:26px;border-radius:50%;background:#e7ebf5;color:#425068;font-weight:800;
          display:flex;align-items:center;justify-content:center;font-size:13px;transition:.15s;margin-top:1px}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .k{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .k{background:var(--bad);color:#fff}
  .opt.locked{cursor:default}
  .opt.dim{opacity:.72}
  .explain{margin-top:18px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
  .explain .ehead{display:flex;align-items:center;gap:10px;padding:11px 16px;font-weight:800;font-size:15px}
  .explain.ok .ehead{background:var(--ok-soft);color:var(--ok)}
  .explain.bad .ehead{background:var(--bad-soft);color:var(--bad)}
  .explain .ebody{padding:14px 16px;font-size:15px;line-height:1.85;color:#334155;white-space:pre-wrap;background:#fff;
       word-break:break-word}
  .explain .ansline{margin:0 0 8px;font-weight:800;color:var(--ink)}
  .answerbox .expbody{border-top:1px dashed var(--line);color:#475569;font-size:14.5px}
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
  button.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:11px 20px;
       font-size:15px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
  button.btn:hover{border-color:#b9c4ea;background:#f5f8ff}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.btn.primary:hover{background:#3149c4}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  button.btn.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
  button.btn.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
  .fillrow{display:flex;align-items:center;gap:12px;margin-top:10px}
  .fillrow .bl{width:28px;font-weight:800;color:var(--accent)}
  select{flex:1;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fbfcfe;color:var(--ink)}
  select.ok{border-color:var(--ok);background:var(--ok-soft)}
  select.bad{border-color:var(--bad);background:var(--bad-soft)}
  .candbank{border:1px dashed #cbd5e1;border-radius:12px;padding:12px 14px;margin-top:14px;background:#f8fafc;
       display:grid;grid-template-columns:repeat(2,1fr);gap:4px 18px;font-size:14px}
  .candbank b{color:var(--accent)}
  .answerbox{margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .answerbox .ahead{background:var(--accent-soft);color:var(--accent);padding:11px 16px;font-weight:800;font-size:15px;
       display:flex;justify-content:space-between;align-items:center;gap:10px}
  .answerbox .ahead .stat{font-size:12px;font-weight:700;background:#fff;border-radius:999px;padding:3px 10px}
  .answerbox .ahead .stat.ok{color:var(--ok)}
  .answerbox .ahead .stat.bad{color:var(--bad)}
  .answerbox .abody{padding:14px 16px;font-size:15px;line-height:1.9;color:#334155;white-space:pre-wrap;
       background:#fff;word-break:break-word}
  .judgebar{display:flex;gap:12px;margin-top:14px}
  .judgebar .btn{flex:1}
  .judgetip{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center}
  .navgrid{margin-top:22px}
  .navgrid h3{font-size:14px;color:var(--muted);margin:0 0 10px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .grid.folded{max-height:264px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 76%,transparent);
       mask-image:linear-gradient(180deg,#000 76%,transparent)}
  .foldbtn{display:block;width:100%;margin-top:10px;border:1px dashed #cbd5e1;background:#f8fafc;color:var(--accent);
       border-radius:10px;padding:9px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
  .foldbtn:hover{background:var(--accent-soft);border-color:#b9c4ea}
  .cell{height:42px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;
        color:#516074;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;
        -webkit-user-select:none;user-select:none;touch-action:manipulation}
  .cell:hover{border-color:#b9c4ea}
  .cell.done-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.done-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .cell.cur{outline:3px solid var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:12px;flex-wrap:wrap}
  .toolbar .grp{display:flex;gap:8px;flex-wrap:wrap}
  .hint{font-size:12.5px;color:var(--muted)}
  .empty{text-align:center;padding:44px 18px}
  .empty .big{font-size:38px;margin-bottom:10px}
  .empty p{color:var(--muted);font-size:14.5px;line-height:1.8;margin:0 0 16px}
  @media (max-width:600px){
    .wrap{padding:14px 10px 96px}
    header.top{padding:10px 12px}
    .topinner{gap:8px}
    .brand{font-size:15px}
    .brand small{display:none}
    .stats{gap:6px}
    .chip{font-size:12px;padding:5px 10px}
    .refresh{padding:7px;border-radius:50%}
    .refresh .rtext{display:none}
    .bar{margin-top:8px}
    .card{padding:18px 14px 16px;border-radius:14px}
    .stem{font-size:16px;line-height:1.7}
    .opt{font-size:15.5px;padding:12px 13px}
    .explain .ebody,.answerbox .abody{font-size:14.5px;padding:12px 13px}
    .nav button.btn{flex:1;padding:11px 10px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
    .cell{height:40px;font-size:12px}
    .candbank{grid-template-columns:1fr}
    .mode{font-size:13px;padding:9px 4px}
    .navgrid{margin-top:18px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="topinner">
    <div class="brand">计算机操作系统 · 刷题<small>《计算机操作系统（慕课版）》试题库 · 共 <span id="totalCount">330</span> 题</small></div>
    <div class="stats">
      <span class="chip n" id="statProgress">进度 0/330</span>
      <span class="chip g" id="statRight">答对 0</span>
      <span class="chip r" id="statWrong">答错 0</span>
      <span class="chip" id="statRate">正确率 —</span>
      <button class="refresh" id="btnRefresh" title="清空作答记录，从头开始" aria-label="重新刷题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
          <path d="M21 3v6h-6"></path>
        </svg>
        <span class="rtext">重新刷题</span>
      </button>
    </div>
  </div>
  <div class="wrap" style="padding:0 16px"><div class="bar"><i id="barFill"></i></div></div>
</header>

<div class="wrap">
  <div class="modes" id="modes">
    <button class="mode active" data-mode="seq">顺序刷题</button>
    <button class="mode" data-mode="rnd">乱序刷题</button>
    <button class="mode" data-mode="wrong">错题本 <span class="cnt" id="wrongCount">0</span></button>
  </div>

  <div class="posline"><span id="posInfo">顺序刷题</span><span class="hint">左右滑动切题</span></div>

  <main id="card" class="card"></main>

  <section class="navgrid" id="gridBox">
    <div class="toolbar">
      <h3>题目导航</h3>
      <div class="grp">
        <button class="btn" id="btnPrev2">上一题</button>
        <button class="btn" id="btnNext2">下一题</button>
        <button class="btn" id="btnReset">重新开始</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <button class="foldbtn" id="btnFold">展开全部 330 题</button>
    <p class="hint" style="margin-top:10px">键盘：A / B / C / D 选择选项（判断题 A=正确、B=错误） · ← → 切换题目 · 手机可左右滑动</p>
  </section>
</div>

<script>
const DATA = [{"num":1,"type":"choice","source":"考研真题","stem":"单道批处理系统的主要缺点是（  ）。","options":[{"label":"A","text":"CPU利用率不高"},{"label":"B","text":"失去了交互性"},{"label":"C","text":"不具备并行性"},{"label":"D","text":"以上都不是"}],"answer":"A","explanation":"单道批处理系统的内存中只有一道程序，当该程序发出I/O请求后，CPU必须等待I/O完成，又因I/O设备的低速性，使CPU长时间处于空闲状态，导致CPU利用率不高。","images":[],"tables":[]},{"num":2,"type":"choice","source":"考研真题","stem":"提高单机资源利用率的关键技术是（  ）。","options":[{"label":"A","text":"脱机技术"},{"label":"B","text":"虚拟技术"},{"label":"C","text":"交换技术"},{"label":"D","text":"多道程序设计技术"}],"answer":"D","explanation":"脱机技术用于解决独占设备问题。虚拟技术与交换技术以多道程序设计技术为前提。多道程程序设计技术由于同时在主存中运行多个程序，在一个程序等待时，可以去执行其他程序，因此提高了系统资源的利用率。","images":[],"tables":[]},{"num":3,"type":"choice","source":"考研真题","stem":"并发性是指若干事件在（  ）发生。","options":[{"label":"A","text":"同一时刻"},{"label":"B","text":"不同时刻"},{"label":"C","text":"同一时间间隔内"},{"label":"D","text":"不同时间间隔内"}],"answer":"C","explanation":"OS的并发性是指两个或多个事件在同一时间间隔内发生。","images":[],"tables":[]},{"num":4,"type":"choice","source":"","stem":"批处理系统的主要缺点是（  ）。","options":[{"label":"A","text":"系统吞吐量小"},{"label":"B","text":"CPU利用率不高"},{"label":"C","text":"资源利用率低"},{"label":"D","text":"无交互能力"}],"answer":"D","explanation":"批处理系统中，作业执行时用户无法干预其运行，只能通过事先编制作业控制说明书来间接干预，缺少交互能力。","images":[],"tables":[]},{"num":5,"type":"choice","source":"考研真题","stem":"（   ）操作系统允许一台主机上同时连接多台终端，多个用户可以通过各自的终端同时交互地使用计算机。","options":[{"label":"A","text":"网络"},{"label":"B","text":"分布式"},{"label":"C","text":"分时"},{"label":"D","text":"实时"}],"answer":"C","explanation":"分时系统能很好地将一台主机提供给多个用户使用，提高计算机的利用率，实现人-机交互和共享主机。","images":[],"tables":[]},{"num":6,"type":"choice","source":"","stem":"实时操作系统必须在（   ）内处理来自外部的事件。","options":[{"label":"A","text":"一个机器周期"},{"label":"B","text":"被控制对象规定时间"},{"label":"C","text":"周转时间"},{"label":"D","text":"时间片"}],"answer":"B","explanation":"实时系统要求能实时处理外部事件，即在规定的时间内完成对外部事件的处理。","images":[],"tables":[]},{"num":7,"type":"choice","source":"考研真题","stem":"操作系统中有一组特殊的程序，它们不能被系统中断，在操作系统中称为（  ）。","options":[{"label":"A","text":"初始化程序"},{"label":"B","text":"原语"},{"label":"C","text":"子程序"},{"label":"D","text":"控制模块"}],"answer":"B","explanation":"原语是指由若干条指令构成的，用于完成某种特定功能的一组程序。原语是原子操作，具有不可分割性，要么全做，要么全不做。原语在执行过程中不允许被中断。","images":[],"tables":[]},{"num":8,"type":"choice","source":"考研真题","stem":"单处理机系统中，可并行的是（   ）。\nⅠ.进程与进程    Ⅱ.处理机与设备    Ⅲ.处理机与通道    Ⅳ.设备与设备","options":[{"label":"A","text":"Ⅰ、Ⅱ、Ⅲ"},{"label":"B","text":"Ⅰ、Ⅱ、Ⅳ"},{"label":"C","text":"Ⅰ、Ⅲ、Ⅳ"},{"label":"D","text":"Ⅱ、Ⅲ、Ⅳ"}],"answer":"D","explanation":"并发性是指若干事件在同一时间间隔内发生，并行性是指若干事件在同一时刻发生。故在单处理机系统中，进程与进程之间只能并发执行。","images":[],"tables":[]},{"num":9,"type":"choice","source":"考研真题","stem":"中断处理和子程序调用都需要压栈以保护现场，中断处理一定会保存而子程序调用不需要保存其内容的是（   ）。","options":[{"label":"A","text":"程序计数器"},{"label":"B","text":"程序状态字寄存器"},{"label":"C","text":"通用数据寄存器"},{"label":"D","text":"通用地址寄存器"}],"answer":"B","explanation":"子程序调用只须保存程序断点，即该指令的下一条指令的地址；中断调用子程序不仅要保存断点（PC的内容），还要保存程序状态字寄存器（PSW）的内容。","images":[],"tables":[]},{"num":10,"type":"choice","source":"考研真题","stem":"进程和程序的本质区别是（  ）。","options":[{"label":"A","text":"前者是动态的，后者是静态的"},{"label":"B","text":"前者存储在内存，后者存储在外存"},{"label":"C","text":"前者在一个文件中，后者在多个文件中"},{"label":"D","text":"前者分时使用CPU，后者独占CPU"}],"answer":"A","explanation":"进程的实质是进程实体的执行过程，具有动态性；而程序是一组有序指令的集合，并存放在某种介质上，是静态的。","images":[],"tables":[]},{"num":11,"type":"choice","source":"","stem":"进程的基本状态（   ）可以由其他两种基本状态转变而来。","options":[{"label":"A","text":"就绪状态"},{"label":"B","text":"执行状态"},{"label":"C","text":"阻塞状态"},{"label":"D","text":"新建状态"}],"answer":"A","explanation":"进程共有三种基本状态，分别是就绪状态、执行状态、阻塞状态。只有就绪状态可以由其他两种基本状态转变而来。","images":[],"tables":[]},{"num":12,"type":"choice","source":"","stem":"进程处于（  ）时，它处于非阻塞态。","options":[{"label":"A","text":"等待从键盘输入数据"},{"label":"B","text":"等待协作进程的一个信号"},{"label":"C","text":"等待操作系统分配CPU时间"},{"label":"D","text":"等待网络数据进入内存"}],"answer":"C","explanation":"进程处于阻塞态是由于等待某个事件而产生，这个事件可以为等待设备的I/O操作、等待信号量的互斥或同步操作，等待网络数据进入内存等都会使进程不满足所需资源而等待。而等待CPU调度的进程处于就绪态，只有它是非阻塞态。","images":[],"tables":[]},{"num":13,"type":"choice","source":"考研真题","stem":"处于挂起就绪状态（即静止就绪状态）的进程，可转换为（   ）。","options":[{"label":"A","text":"阻塞状态（即活动阻塞状态）"},{"label":"B","text":"就绪状态（即活动就绪状态）"},{"label":"C","text":"运行状态"},{"label":"D","text":"挂起阻寒状态（即静止阻塞状态）"},{"label":"E","text":"运行状态或就绪状态（即活动就绪状态）"},{"label":"F","text":"运行或阻塞状态（即活动阻塞状态）"},{"label":"G","text":"就绪状态（即活动就绪状态）或挂起阻塞状态（即静止阻塞状态）"}],"answer":"B","explanation":"某些OS中，为了更好地管理和调度进程及适应系统的功能目标，增加了挂起状态。处于挂起就绪状态的进程，被激活后转为活动就绪。","images":[],"tables":[]},{"num":14,"type":"choice","source":"考研真题","stem":"程序运行时独占系统资源，只有程序本身能改变系统资源状态，这是指（  ）。","options":[{"label":"A","text":"程序顺序执行的再现性"},{"label":"B","text":"并发程序失去再现性"},{"label":"C","text":"并发程序失夫封闭性"},{"label":"D","text":"程序顺序执行时的封闭性"}],"answer":"D","explanation":"程序顺序执行时的封闭性是指程序在封闭的环境下运行，即程序运行时独占全机系统资源，只有本程序才能改变系统资源状态（除初始状态外），程序一旦开始执行，其执行结果不受外界因素影响。","images":[],"tables":[]},{"num":15,"type":"choice","source":"名校考研题","stem":"进程和程序的本质区别在于（  ）。","options":[{"label":"A","text":"前者分时使用CPU，或者独占CPU"},{"label":"B","text":"前者存储在内存，后者存储在外存"},{"label":"C","text":"前者具有异步性，后者具有可再现性"},{"label":"D","text":"前者可以并发执行，后者不能并发执行"}],"answer":"D","explanation":"OS为了提高系统吞吐量和资源利用率，引入了进程，来支持并发。程序是不能并发的，只有程序被创建成进程，才能并发执行。","images":[],"tables":[]},{"num":16,"type":"choice","source":"考研真题","stem":"进程的状态和优先级信息存放在（   ）。","options":[{"label":"A","text":"JCB"},{"label":"B","text":"PCB"},{"label":"C","text":"快表"},{"label":"D","text":"页表"}],"answer":"B","explanation":"PCB是进程存在的唯一标识，它存储着进程的状态和优先级等信息。","images":[],"tables":[]},{"num":17,"type":"choice","source":"考研真题","stem":"一个进程的读磁盘操作完成后，操作系统针对该进程必做的是（   ）。","options":[{"label":"A","text":"修改进程状态为就绪态"},{"label":"B","text":"降低进程优先级"},{"label":"C","text":"进程分配用户内存空间"},{"label":"D","text":"增加进程的时间片大小"}],"answer":"A","explanation":"进程等待I/O操作完成便会从阻塞状态转换到就绪状态。","images":[],"tables":[]},{"num":18,"type":"choice","source":"考研真题","stem":"下列选项中，会导致进程从执行态变为就绪态的事件是（   ）。","options":[{"label":"A","text":"执行P操作"},{"label":"B","text":"申请内存失败"},{"label":"C","text":"启动I/O设备"},{"label":"D","text":"被高优先级进程抢占"}],"answer":"D","explanation":"A、B、C都因为进程请求资源而进入阻塞态；进程被高优先级进程抢占，被剥夺了处理机资源而进入就绪态，一旦重新获得处理机资源便会继续执行。","images":[],"tables":[]},{"num":19,"type":"choice","source":"考研真题","stem":"用信箱实现进程间互通信息的通信机制要有两个通信原语，它们是（   ）。","options":[{"label":"A","text":"发送原语和执行原语"},{"label":"B","text":"就绪原语和执行原语"},{"label":"C","text":"发送原语和接收原语"},{"label":"D","text":"就绪原语和接收原语"}],"answer":"C","explanation":"用信箱实现进程间互通信息的通信机制要有两个通信原语，它们是发送原语和接收原语。","images":[],"tables":[]},{"num":20,"type":"choice","source":"","stem":"死锁的4个必要条件中，无法破坏的是（   ）。","options":[{"label":"A","text":"环路等待资源"},{"label":"B","text":"互斥使用资源"},{"label":"C","text":"占有且等待资源"},{"label":"D","text":"非抢夺式分配"}],"answer":"B","explanation":"破坏互斥使用资源，是指允许多个进程同时访问资源，但有些资源根本不能同时访问，如打印机只能互斥使用。因此，破坏互斥条件而预防死锁的方法不可行，而且在有的场合应该保护这种互斥性。其他3个条件都可以实现。","images":[],"tables":[]},{"num":21,"type":"choice","source":"","stem":"死锁与安全状态的关系是（   ）。","options":[{"label":"A","text":"死锁状态有可能是安全状态"},{"label":"B","text":"安全状态有可能成为死锁状态"},{"label":"C","text":"不安全状态就是死锁状态"},{"label":"D","text":"死锁状态一定是不安全状态"}],"answer":"D","explanation":"如下图所示，并非所有不安全状态都是死锁状态，但当系统进入不安全状态后，便可能进入死锁状态；反之，只要系统处于安全状态，系统便可避免进入死锁状态；死锁状态必定是不安全状态。","images":[],"tables":[]},{"num":22,"type":"choice","source":"","stem":"以下有关资源分配图的描述中，正确的是（   ）。","options":[{"label":"A","text":"有向边包括进程指向资源类的分配边和资源类指向进程申请边两类"},{"label":"B","text":"矩形框表示进程，其中圆点表示申请同一类资源的各个进程"},{"label":"C","text":"圆圈结点表示资源类"},{"label":"D","text":"资源分配图是一个有向图，用于表示某时刻系统资源与进程之间的状态"}],"answer":"D","explanation":"进程指向资源的有向边称为申请边，资源指向进程的有向边称为分配边，矩形框表示资源，其中的圆点表示资源的数目，圆圈结点表示进程。","images":[],"tables":[]},{"num":23,"type":"choice","source":"考研真题","stem":"下面的情况中，进程调度可能发生的时机有（   ）。\nⅠ.正在执行的进程时间片用完\nⅡ.正在执行的进程提出I/O请求后进入等待状态\nⅢ.有新的用户登录进入系统\nⅣ.等待硬盘读取数据的进程获得了所需的数据","options":[{"label":"A","text":"Ⅰ"},{"label":"B","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"label":"C","text":"Ⅰ、Ⅱ、Ⅳ"},{"label":"D","text":"Ⅰ、Ⅲ、Ⅳ"}],"answer":"B","explanation":"正在执行的进程时间片用完后进入就绪状态，系统会调入一个新的进程分配处理机执行；正在执行的进程提出I/O请求后进入等待状态，系统同样会调入一个新的进程分配处理机执行；有新的用户登录进入系统会创建新的进程，若处理机空闲，则可进行进程调度;等待硬盘读取数据的进程获得了所需的数据后，若处理机空闲，则可进行进程调度。","images":[],"tables":[]},{"num":24,"type":"choice","source":"考研真题","stem":"假设4个作业到达系统的时刻和运行时间如表所示。\n系统在t=2时开始作业调度。若分别采用先来先服务和短作业优先调度算法，则选中的作业分别是（   ）。","options":[{"label":"A","text":"J2、J3"},{"label":"B","text":"J1、J4"},{"label":"C","text":"J2、J4"},{"label":"D","text":"J1、J3"}],"answer":"D","explanation":"先来先服务调度算法是作业来得越早，优先级越高，因此会选择J1。短作业优先调度算法是作业运行时间越短，优先级越高，因此会选择J3。","images":[],"tables":[[["作业","到达时刻t","运行时间"],["J1","0","3"],["J2","1","3"],["J3","1","2"],["J4","3","1"]]]},{"num":25,"type":"choice","source":"考研真题","stem":"时间片轮转调度算法是为了（   ）。","options":[{"label":"A","text":"多个用户能及时干预系统"},{"label":"B","text":"使系统变得高效"},{"label":"C","text":"优先级较高的进程得到及时响应"},{"label":"D","text":"需要CPU时间最少"}],"answer":"A","explanation":"时间片轮转的主要目的是，使得多个交互的用户能够得到及时响应，因此它不会对特殊进程做特殊服务。时间片轮转增加了系统开销，吞吐量和周转时间均不如批处理。但其较快速的响应时间使得用户能够与计算机进行交互，改善了人机环境，满足用户需求。","images":[],"tables":[]},{"num":26,"type":"choice","source":"","stem":"一个作业8:00到达系统，估计运行时间为1小时。若10:00开始执行该作业，其响应比是（   ）。","options":[{"label":"A","text":"2"},{"label":"B","text":"1"},{"label":"C","text":"3"},{"label":"D","text":"0.5"}],"answer":"C","explanation":"响应比=响应时间/要求服务时间=(等待时间+要求服务时间)/要求服务时间=(2+1)/1=3。","images":[],"tables":[]},{"num":27,"type":"choice","source":"考研真题","stem":"下列调度算法中，不会导致饥饿现象的是（   ）。","options":[{"label":"A","text":"时间片轮转"},{"label":"B","text":"静态优先数调度"},{"label":"C","text":"非抢占式短任务优先"},{"label":"D","text":"抢占式短任务优先"}],"answer":"A","explanation":"采用静态优先级调度且系统总是出现优先级高的任务时，优先级低的任务总是得不到处理机而产生饥饿现象。短任务优先调度当系统总是出现新来的短任务时，长任务总是得不到处理机，会产生饥饿现象。","images":[],"tables":[]},{"num":28,"type":"choice","source":"考研真题","stem":"系统中有4个进程都要使用某类资源。若每个进程最多需要3个该类资源，为保证系统不发生死锁，系统应提供该类资源至少是（   ）。","options":[{"label":"A","text":"3个"},{"label":"B","text":"4个"},{"label":"C","text":"9个"},{"label":"D","text":"12个"}],"answer":"C","explanation":"系统中有4个进程，每个进程最多需要3个资源，先给每个进程分配2个资源，共需要8个资源，此时需要系统中还有1个空闲资源，分配给任一进程，才不会发生死锁，故至少需要9个资源。","images":[],"tables":[]},{"num":29,"type":"choice","source":"考研真题","stem":"某计算机系统中有8台打印机，由K个进程竞争使用，每个进程最多需要3台打印机。该系统可能会发生死锁的K的最小值是（   ）。","options":[{"label":"A","text":"2"},{"label":"B","text":"3"},{"label":"C","text":"4"},{"label":"D","text":"5"}],"answer":"C","explanation":"因为每个进程最多需要3台打印机，最极端的情况是每个进程已经占有了2台打印机，若此时至少还有1个可用打印机，就能满足任一个进程3台的条件，顺利执行。所以将8台打印机分给K个进程，每个进程有2台打印机，K为4。","images":[],"tables":[]},{"num":30,"type":"choice","source":"考研真题","stem":"系统中有3个不同的临界资源R1，R2和R3，被4个进程P1，P2，P3，P4共享。各进程对资源的需求为：P1申请R1和R2，P2申请R2和R3，P3申请R1和R3，P4申请R2。若系统出现死锁，则处于死锁状态的进程数至少是（   ）。","options":[{"label":"A","text":"1"},{"label":"B","text":"2"},{"label":"C","text":"3"},{"label":"D","text":"4"}],"answer":"C","explanation":"因为 P4只申请一个资源，当将R2分配给P4后，P4执行完后将R2释放，这时使得系统满足死锁的条件是R1分配给P1，R2分配给P2，R3分配给P3，（或者R2分配给P1，R3分配给P2，R1分配给P3）。穷举其他情况如P1申请的资源R1和R2，先都分配给P1，运行完并释放占有的资源后，可分别将R1，R2和R3分配给P3，P4和P2，也满足系统死锁的条件。各种情况需要使得处于死锁状态的进程数至少为3。","images":[],"tables":[]},{"num":31,"type":"choice","source":"","stem":"采用资源剥夺法可以解除死锁，还可以采用（   ）方法解除死锁。","options":[{"label":"A","text":"执行并行操作"},{"label":"B","text":"撒销进程"},{"label":"C","text":"拒绝分配新资源"},{"label":"D","text":"修改信号量"}],"answer":"B","explanation":"资源剥夺法允许一个进程强行剥夺其他进程所占有的系统资源。而撤销进程强行释放一个进程已占有的系统资源，与资源剥夺法同理，都通过破坏死锁的“请求和保持”条件来解除死锁。拒绝分配新资源只能维持死锁的现状，无法解除死锁。","images":[],"tables":[]},{"num":32,"type":"choice","source":"","stem":"在操作系统中，P、V操作是一种（   ）。","options":[{"label":"A","text":"机器指令"},{"label":"B","text":"系统调用命令"},{"label":"C","text":"作业控制命令"},{"label":"D","text":"进程低级通信原语"}],"answer":"D","explanation":"P、V操作是操作系统对信号量执行的原语操作，用于解决进程之间的同步关系，属于进程之间的低级通信。","images":[],"tables":[]},{"num":33,"type":"choice","source":"","stem":"进程并发地在处理机上执行时，（   ）。","options":[{"label":"A","text":"进程之间是无关的，系统是封闭的"},{"label":"B","text":"进程之间具有交互性、并发性，它们既相互依赖，又相互制约"},{"label":"C","text":"进程之间可能具有交往，也可能无关"},{"label":"D","text":"上述都不对"}],"answer":"C","explanation":"多进程的并发执行，使系统不再具有封闭性。但是它们是否相互依赖又相互制约，要看进程之间是否共享资源或共同完成同一任务。","images":[],"tables":[]},{"num":34,"type":"choice","source":"考研真题","stem":"在9个生产者，5个消费者，共享容量为7的缓冲区的生产者-消费者问题中。互斥使用缓冲区的信号量S的初值为（   ）。","options":[{"label":"A","text":"9"},{"label":"B","text":"5"},{"label":"C","text":"7"},{"label":"D","text":"1"}],"answer":"D","explanation":"关于缓冲区的使用，这是典型的互斥问题，一次只允许一个进程使用，故设置信号量S初值为1。","images":[],"tables":[]},{"num":35,"type":"choice","source":"考研真题","stem":"若记录型信号量S的初值为15，当前值为-15，则表示有（   ）等待进程。","options":[{"label":"A","text":"15个"},{"label":"B","text":"30个"},{"label":"C","text":"16个"},{"label":"D","text":"31个"}],"answer":"A","explanation":"当S值小于0时，绝对值表示阻塞队列中进程的个数。","images":[],"tables":[]},{"num":36,"type":"choice","source":"","stem":"进程A和B共享同一临界资源，并且进程A正处于对应的临界区内执行。请从下列描述中选择一条正确的描述。（   ）","options":[{"label":"A","text":"进程A的执行不能被中断，即临界区的代码具有原子性。"},{"label":"B","text":"进程A的执行能被中断，但中断A后，不能将CPU调度给B进程。"},{"label":"C","text":"进程A的执行能被中断，而且只要B进程就绪，就可以将CPU调度给B进程。"},{"label":"D","text":"进程A的执行能被中断，而且只要B进程就绪，就必定将CPU调度给B进程。"}],"answer":"C","explanation":"进程A和B是并发执行的，执行顺序可以任意。因此，A在执行过程中，只要B进程就绪，就可以调度B，使B获得CPU使用权，A进程被中断。","images":[],"tables":[]},{"num":37,"type":"choice","source":"","stem":"从下面对临界区的论述中，选出一条正确的论述。（   ）","options":[{"label":"A","text":"临界区是指进程中用于实现进程同步的那段代码"},{"label":"B","text":"临界区是指进程中用于实现进程通信的那段代码"},{"label":"C","text":"临界区是指进程中用于访问共享资源的那段代码"},{"label":"D","text":"临界区是指进程中访问临界资源的那段代码"}],"answer":"D","explanation":"临界区是指进程中访问临界资源的那段代码。","images":[],"tables":[]},{"num":38,"type":"choice","source":"","stem":"两个旅行社甲和乙为旅客到某航空公司订飞机票，形成互斥资源的是（   ）。","options":[{"label":"A","text":"旅行社"},{"label":"B","text":"航空公司"},{"label":"C","text":"数据"},{"label":"D","text":"旅行社与航空公司"}],"answer":"C","explanation":"一张飞机票不能同时售给不同的乘客，因此飞机票是临界资源，其他因素只是为完成飞机票订票的中间过程，与互斥无关。","images":[],"tables":[]},{"num":39,"type":"choice","source":"考研真题","stem":"设与某资源相关联的信号量初值为3，当前值为1，若M表示该资源的可用个数，N表示等待资源的进程数，则M、N分别是（   ）。","options":[{"label":"A","text":"0、1"},{"label":"B","text":"1、0"},{"label":"C","text":"1、2"},{"label":"D","text":"2、0"}],"answer":"B","explanation":"根据信号量的物理含义：S.value＞0时表示有S.value个资源可用；S.value=0表示无资源可用；S.value＜0则S.value的绝对值表示等待队列中的进程个数。信号量的当前值为1，则表示该资源的可用个数为1，没有等待该资源的进程。","images":[],"tables":[]},{"num":40,"type":"choice","source":"考研真题","stem":"若记录型信号量S的初值是3，则当前值为1时表示有（   ）个阻塞等待进程。","options":[{"label":"A","text":"1个"},{"label":"B","text":"2个"},{"label":"C","text":"0个"},{"label":"D","text":"1个或者2个"},{"label":"E","text":"3个"}],"answer":"C","explanation":"S为1，值大于0，说明允许进程访问资源，进入临界区，当前没有阻塞等待的进程。","images":[],"tables":[]},{"num":41,"type":"choice","source":"考研真题","stem":"在对记录型信号量的P操作的定义中，当信号量的值（   ）时，执行P操作的进程变为阻塞状态。","options":[{"label":"A","text":"大于0"},{"label":"B","text":"小于0"},{"label":"C","text":"等于0"},{"label":"D","text":"小于或等于0"}],"answer":"B","explanation":"对于记录型信号量，每执行一次P操作，信号量的值都会减1，当信号量的值小于0的时候，说明系统中无可用临界资源，进程变为阻塞状态。","images":[],"tables":[]},{"num":42,"type":"choice","source":"考研真题","stem":"如果3个进程共享一个互斥段，每次最多可以允许2个进程进入互斥段，则信号量的变化范围是（   ）。","options":[{"label":"A","text":"2、1、0、-1"},{"label":"B","text":"3、2、1、0"},{"label":"C","text":"2，1、0、-1，-2"},{"label":"D","text":"1、0、-1，-2"}],"answer":"A","explanation":"最多允许2个进程进入互斥段，初始值则为2，因为每个进程进去时都先要行P操作，然后判断信号量的值是否大于0，不是则表示当前互斥段内已经有2个进程，当第3个进程再执行P操作时，信号量值为-1，该进程阻塞。","images":[],"tables":[]},{"num":43,"type":"choice","source":"考研真题","stem":"在可变分区分配方案中，当某一作业完成、系统回收其主存空间时，回收分区可能存在与相邻空闲区合并的情况，为此须修改空闲分区表。其中，造成空闲分区数减1的情况是（   ）。","options":[{"label":"A","text":"既无上邻空闲分区，也无下邻空闲分区"},{"label":"B","text":"虽无上邻空闲分区，但有下邻空闲分区"},{"label":"C","text":"虽有上邻空闲分区，但无下邻空闲分区"},{"label":"D","text":"既有上邻空闲分区，也有下邻空闲分区"}],"answer":"D","explanation":"A中，既没有上邻空闲分区，也没有下邻空闲分区。那么系统回收的时候要增加1个空闭分区。B中，回收的分区无上邻空闲分区，但是有下邻空闲分区，将回收区合并到下邻分区中，因此要修改空闲分区的首地址为回收区地址，大小为合并空闲分区之和，空闲区块数目不变。C中，回收区上邻空闲分区，但无下邻空闲分区，那么上邻空闲区的首地址不变，新的分区大小是上邻分区和回收区大小之和，空闲区块数目没有发生变化。D中，回收区上下邻空闲区，回收该分区时，将上下邻空闲分区和回收区合并在一起，首地址为上邻空闲分区的首地址，大小为3个分区之和。","images":[],"tables":[]},{"num":44,"type":"choice","source":"考研真题","stem":"采用动态分区算法回收内存时，如果回收区仅与空闲区链插入点前一个分区相邻接，那么需要在空闲区链表中（   ）。","options":[{"label":"A","text":"增加一个新表项"},{"label":"B","text":"修改前一个分区表项的大小"},{"label":"C","text":"修改前一个分区表项的首地址"},{"label":"D","text":"修改前一个分区表项的大小和首地址"}],"answer":"B","explanation":"当进程运行完毕释放内存时，系统根据回收区的首址， 从空闲区链中找到相应的插入点，此时可能出现以下4种情况之一：\n（1）回收区与插入点的前一个分区F1相邻接，这就是B选项，只须要修改前一个分区表项的大小，把回收区的大小加进去即可；\n（2）回收分区与插入点的后一分区F2相邻接，此种方案我们认为，也须要修改分区表项的首地址（如果回收区处于低地址的话），并修改表项的大小；\n（3）回收区同时与插入点的前、后两个分区邻接，对应D答案；\n（4）回收区既不与F1邻接，也不与F2邻接。这需要新建表项，对应于A答案。","images":[],"tables":[]},{"num":45,"type":"choice","source":"考研真题","stem":"采用（   ）不会产生内部碎片。","options":[{"label":"A","text":"分页式存储管理"},{"label":"B","text":"分段式存储管理"},{"label":"C","text":"随机存储管理"},{"label":"D","text":"段页式存储管理"}],"answer":"B","explanation":"在页式存储管理的方式中，最后1个页面往往会出现不足1页大小的情况，产生页内碎片。","images":[],"tables":[]},{"num":46,"type":"choice","source":"考研真题","stem":"采用分页存储管理方式进行存储分配时产生的存储碎片，被称为（   ）。","options":[{"label":"A","text":"外零头"},{"label":"B","text":"内零头"},{"label":"C","text":"外零头或内零头"},{"label":"D","text":"A、B、C都正确"}],"answer":"B","explanation":"分页存储管理方式将内存分成大小相等的若干块，可能最后一个页面大小不足1页，但也要分配一个物理块，此时出现的零头为内零头。","images":[],"tables":[]},{"num":47,"type":"choice","source":"考研真题","stem":"某计算机主存按字节编址，采用二级分页存储管理，地址结构如下所示。\n虚拟地址2050 1225H对应的页目录号、页号分别是（   ）。","options":[{"label":"A","text":"081H、101H"},{"label":"B","text":"081H、401H"},{"label":"C","text":"201H、101H"},{"label":"D","text":"201H、401H"}],"answer":"A","explanation":"根据地址结构转化给出的虚地址的二进制为：\n0010 0000 0101 0000 0001 0010 0010 0101\n其中，低址开始的0~11位为页内偏移，即0010 0010 0101；12~21位为页号，即01 0000 0001=101H；其余高址部分为页目录号，即00 1000 0001=081H。","images":[],"tables":[[["页目录号(10位)","页号(10位)","页内偏移(12位)"]]]},{"num":48,"type":"choice","source":"考研真题","stem":"在页式存储管理系统中，页表内容如表所示（均从0开始编号）。\n若页面大小为4KB，则地址变换机构将逻辑地址0转换成物理地址为（   ）。","options":[{"label":"A","text":"8192"},{"label":"B","text":"4096"},{"label":"C","text":"2048"},{"label":"D","text":"1024"}],"answer":"A","explanation":"逻辑地址0，对应页号为0，查页表可知块号为2，物理地址为24K=8K=8192。","images":[],"tables":[[["页号","块号"],["0","2"],["1","1"],["2","6"],["3","3"],["4","7"]]]},{"num":49,"type":"choice","source":"考研真题","stem":"某进程的段表内容如表所示。\n当访问段号为2，段内地址为400的逻辑地址时，地址转换的结果是（   ）。","options":[{"label":"A","text":"段缺失异常"},{"label":"B","text":"得到内存地址4400"},{"label":"C","text":"越权异常"},{"label":"D","text":"越界异常"}],"answer":"D","explanation":"段号为2的段，其段长为300，所给逻辑地址的段内地址400超过了本段的段长300，会发生越界。","images":[],"tables":[[["段号","段长","内存起始地址","权限","状态"],["0","100","6000","只读","在内存"],["1","200","—","读写","不在内存"],["2","300","4000","读写","在内存"]]]},{"num":50,"type":"choice","source":"考研真题","stem":"可重定位内存的分区分配目的是为（   ）。","options":[{"label":"A","text":"解决碎片问题"},{"label":"B","text":"便于多作业共享内存"},{"label":"C","text":"便于用户干预"},{"label":"D","text":"回收空白区方便"}],"answer":"A","explanation":"为了解决碎片问题，采用紧凑技术移动内存中的所有作业，使它们相邻，用动态重定位方法解决移动后地址的重定位，因此动态重定位是为了解决碎片问题。","images":[],"tables":[]},{"num":51,"type":"choice","source":"考研真题","stem":"在存储管理中，采用交换技术的目的是（   ）。","options":[{"label":"A","text":"减少程序占用的主存空间"},{"label":"B","text":"物理上扩充主存容量"},{"label":"C","text":"提高CPU效率"},{"label":"D","text":"便于代码在主存中共享"}],"answer":"A","explanation":"交换的提出就是为了解决主存空间不足的问题，只是将暂时不用的部分换出主存，以节省空间，从而逻辑上扩充了主存。","images":[],"tables":[]},{"num":52,"type":"choice","source":"考研真题","stem":"所谓“存储保护”的基本含义，最恰当的描述是（   ）。","options":[{"label":"A","text":"防止存储器硬件受损"},{"label":"B","text":"防止程序在内存丢失"},{"label":"C","text":"防止程序间相互越界访问"},{"label":"D","text":"防止程序被人偷看"}],"answer":"C","explanation":"存储保护主要防止程序之间的越界访问。","images":[],"tables":[]},{"num":53,"type":"choice","source":"考研真题","stem":"分页存储管理系统中，虚拟地址转换成物理地址的工作是由（   ）完成的。","options":[{"label":"A","text":"地址转换程序"},{"label":"B","text":"用户程序"},{"label":"C","text":"硬件"},{"label":"D","text":"装入程序"}],"answer":"C","explanation":"把虚拟地址转换成物理地址，是硬件自动完成的。计算机硬件自动把地址空间的地址分为页号和页内相对地址，通过页号在页表找到内存中的对应块号，内存的物理地址用下面的公式计算得出：内存的物理地址=块号×页面大小+页内偏移地址。","images":[],"tables":[]},{"num":54,"type":"choice","source":"考研真题","stem":"在请求页式存储管理中，若所需页面不在内存中，则会引起（   ）。","options":[{"label":"A","text":"输入输出中断"},{"label":"B","text":"缺段中断"},{"label":"C","text":"越界中断"},{"label":"D","text":"页故障"}],"answer":"D","explanation":"在请求页式存储管理中，若所需页面不在内存中，则会引起页故障，即缺页中断。","images":[],"tables":[]},{"num":55,"type":"choice","source":"考研真题","stem":"计算机系统中判断是否有中断发生，应是在（   ）。","options":[{"label":"A","text":"进程切换时"},{"label":"B","text":"执行完一条指令时"},{"label":"C","text":"执行P操作后"},{"label":"D","text":"由用户态转入核心态时"}],"answer":"B","explanation":"缺页中断是在程序的执行过程中，发现页面不在内存中，所以去调页。它发生在指令执行期间。系统中断是发生在系统执行完一条指令之后。","images":[],"tables":[]},{"num":56,"type":"choice","source":"考研真题","stem":"在页式存储管理系统中，采用某些页面置换算法，会出现Belady异常现象，即进程的缺页次数会随着分配给该进程的页框个数的增加而增加。下列算法中，可能出现Belady异常现象的是（   ）。","options":[{"label":"A","text":"FIFO算法"},{"label":"B","text":"LRU算法"},{"label":"C","text":"OPT算法"},{"label":"D","text":"CLOCK算法"}],"answer":"A","explanation":"Belady现象是系统为进程分配的页数增多（未分配进程所需的全部页），但缺页率反而提高的异常现象。只有FIFO算法才会出现Belady现象。FIFO算法将最早调入的页调出，而调出的页在不久可能会被重新使用出现反复调入调出，缺页率反而上升。","images":[],"tables":[]},{"num":57,"type":"choice","source":"考研真题","stem":"系统为某进程分配了4个页框，该进程已访问的页号序列为2、0、2、9、3、4、2、8、2、4、8、4、5。若进程要访问的下一页的页号为7，依据LRU算法，应淘汰页的页号是（   ）。","options":[{"label":"A","text":"2"},{"label":"B","text":"3"},{"label":"C","text":"4"},{"label":"D","text":"8"}],"answer":"A","explanation":"进程分配了4个页框，只能容纳4个页面，超过4个页面时，就要从当前页面中选择一个淘汰。LRU算法赋予每个页面一个访问字段，用来记录一个页面自上次被访问以来所经历的时间t，当须淘汰一个页面时，选择现有页面中其t 值最大的，即最近最少使用的页面予以淘汰。根据算法思想，在进行访问页面时淘汰页分别是0、9、3、2。如图所示。","images":[],"tables":[]},{"num":58,"type":"choice","source":"考研真题","stem":"某系统采用LRU页置换算法和局部置换策略，若系统为进程P预分配了4个页框，进程P访问页号的序列为0、1、2、7、0、5、3、5、0、2、7、6，则进程访问上述页的过程中，产生页置换的总次数是（   ）。","options":[{"label":"A","text":"3"},{"label":"B","text":"4"},{"label":"C","text":"5"},{"label":"D","text":"6"}],"answer":"C","explanation":"通过LRU页置换算法和局部置换策略，也就是在进行页的置换时采用淘汰最近最久未用页面的机制，如图所示。\n所以，页面置换的总次数为5次。","images":[],"tables":[]},{"num":59,"type":"choice","source":"考研真题","stem":"当系统发生抖动（thrashing）时，可以采取的有效措施是（   ）。\nⅠ.撤销部分进程     Ⅱ.增加磁盘交换区的容量     Ⅲ.提高用户进程的优先级","options":[{"label":"A","text":"仅Ⅰ"},{"label":"B","text":"仅Ⅱ"},{"label":"C","text":"仅Ⅲ"},{"label":"D","text":"仅Ⅰ、Ⅱ"}],"answer":"A","explanation":"在具有对换功能的操作系统中，通常把外存分为文件区和对换区。前者用于存放文件，后者用于存放从内存换出的进程。抖动现象是指刚刚被换出的页很快又要被访问，又要换出其他页，而该页又快被访问，如此频繁地置换页面，以致大部分时间都花在页面置换上。撤销部分进程可以减少所要用到的页面数，防止抖动。而交换区大小和进程优先级都与抖动无关。","images":[],"tables":[]},{"num":60,"type":"choice","source":"考研真题","stem":"下列措施中，能加快虚实地址转换的是（   ）。\n1增大快表(TLB)    2让页表常驻内存    3增大交换区","options":[{"label":"A","text":"仅1"},{"label":"B","text":"仅2"},{"label":"C","text":"仅1，2"},{"label":"D","text":"仅2，3"}],"answer":"C","explanation":"增大快表能增加快表的命中率，即减少了访问内存的次数；让页表常驻内存能够使CPU不用访问内存找页表，也加快了虚实地址转换。而增大交换区只是对内存的一种扩充作用，对虚实地址转换并无影响。","images":[],"tables":[]},{"num":61,"type":"choice","source":"","stem":"在分页虚拟存储管理中，“二次机会”调度策略和“时钟”调度策略在决定淘汰哪一页时，都用到了（   ）。","options":[{"label":"A","text":"虚实地址变换机构"},{"label":"B","text":"快表"},{"label":"C","text":"引用位"},{"label":"D","text":"修改位"}],"answer":"C","explanation":"“二次机会”调度策略和“时钟”调度策略都是LRU算法的近似算法，两者都考虑了最近一段时间内页面的引用情况，即都用到了“引用位”。","images":[],"tables":[]},{"num":62,"type":"choice","source":"","stem":"下面关于虚拟存储管理的论述中，正确的是（   ）。","options":[{"label":"A","text":"为了能让更多的进程同时运行，可以只装入10%~30%的进程映像，即启动运行"},{"label":"B","text":"最佳页面置换算法是实现页式虚拟存储管理的常用算法"},{"label":"C","text":"即使在多用户操作系统环境下，用户也可以运用机器指令访问任一合法的物理地址"},{"label":"D","text":"为提高内存保护的灵活性，内存保护通常由软件完成"}],"answer":"A","explanation":"最佳页面置换算法无法实现；用户可以运用机器指令访问任一虚拟地址空间能映射到的物理地址，但是没有映射到的物理地址就无法访问；内存保护通常由硬件完成的，如页表寄存器等。","images":[],"tables":[]},{"num":63,"type":"choice","source":"","stem":"请求分段系统在分段系统的基础上，增加了（   ）及分段置换软件功能。","options":[{"label":"A","text":"请求调段"},{"label":"B","text":"段表"},{"label":"C","text":"缺段中断"},{"label":"D","text":"地址变换"}],"answer":"A","explanation":"请求分段存储管理系统是在基本分段存储系统的基础上，增加了请求调段及置换功能。","images":[],"tables":[]},{"num":64,"type":"choice","source":"","stem":"实现虚拟存储器管理一般包括两个方面的支持，它们是（    ）。","options":[{"label":"A","text":"地址变换机构和对象管理机构"},{"label":"B","text":"地址变换机构和页面调度策略"},{"label":"C","text":"高速缓存机构和页面调度机构"},{"label":"D","text":"高速缓存机构和对象管理机构"}],"answer":"B","explanation":"虚拟存储器，是指具有请求调入功能和置换功能，能从逻辑上对内存容量加以扩充的一种存储器系统。因为需要请求调页，所以需要在基本分页地址变换机构的基础上加以发展形成，因为要进行置换页面，所以需要页面调度策略的支持。","images":[],"tables":[]},{"num":65,"type":"choice","source":"","stem":"通道是一种（   ）。","options":[{"label":"A","text":"保存 I/O 信息的部件"},{"label":"B","text":"传输信息的电子线路"},{"label":"C","text":"通用处理机"},{"label":"D","text":"专用处理机"}],"answer":"D","explanation":"通道是一种特殊的I/O专用处理机。引入通道是为了建立独立的I/O操作，这不仅指数据的传送能独立于CPU，而且有关I/O操作的组织，管理及结束也尽量独立，以保证CPU有更多的时间去进行数据处理。","images":[],"tables":[]},{"num":66,"type":"fill","source":"考研真题","stem":"在主机I/O结构的系统中，由 A 代替CPU完成与设备的通信。当用户进程发出I/O，转入 B 。设备独立性软件唤醒 C ，组织通道程序，并启动通道，然后自行 D ，当I/O完成CPU相应通道发来的中断请求，再次唤醒 E 操作， C 把输入缓冲区的数据分离出来送 E ，并唤醒 F 然后自行阻塞，等待新的 I/O请求的到来。","options":[],"explanation":"在主机I/O结构系统中，由设备控制器代替CPU完成与设备的通信，当用户进程发出I/O请求后，转入核心态。设备独立性软件唤醒设备驱动程序，设备驱动程序组织通道程序，并启动通道，然后自行阻塞。当I/O完成CPU相应通道发来的中断请求，再次唤醒设备驱动程序，并进行中断处理。如果是输入操作，设备驱动程序把输入缓冲区的数据分离出来送用户数据区，并唤醒请求者进程，然后自行阻塞，等待新的I/O请求的到来。","tables":[[["[1] 通道","[9] 设备驱动进程"],["[2] 控制器","[10] 阻塞"],["[3] DMA","[11] 挂起"],["[4] 端口","[12] 用户数据区"],["[5] 用户态","[13] 输出缓冲区"],["[6] 核心态","[14] 请求者进程"],["[7] 设备分配程序","[15] 输出进程"],["[8] 进程调度",""]]],"candidates":[{"n":"1","text":"通道"},{"n":"9","text":"设备驱动进程"},{"n":"2","text":"控制器"},{"n":"10","text":"阻塞"},{"n":"3","text":"DMA"},{"n":"11","text":"挂起"},{"n":"4","text":"端口"},{"n":"12","text":"用户数据区"},{"n":"5","text":"用户态"},{"n":"13","text":"输出缓冲区"},{"n":"6","text":"核心态"},{"n":"14","text":"请求者进程"},{"n":"7","text":"设备分配程序"},{"n":"15","text":"输出进程"},{"n":"8","text":"进程调度"}],"correct_map":{"A":"2","B":"6","C":"9","D":"10","E":"12","F":"14"},"answerText":"A→[2] 控制器；B→[6] 核心态；C→[9] 设备驱动进程；D→[10] 阻塞；E→[12] 用户数据区；F→[14] 请求者进程"},{"num":67,"type":"choice","source":"考研真题","stem":"关于I/O控制方式，（   ）控制方式使对I/O操作的组织和数据的传送能最大限度地独立运行而无需处理机的干预。","options":[{"label":"A","text":"I/O通道"},{"label":"B","text":"中断驱动I/O"},{"label":"C","text":"程序I/O"},{"label":"D","text":"直接存储器访问I/O"}],"answer":"A","explanation":"程序I/O方式（轮询可编程方式）中，CPU要不断地测试I/O设备的状态。中断驱动方式，允许I/O设备中断CPU并请求服务，使CPU向I/O控制器发送读命令后可以继续做其他工作。DMA 控制方式是在1块数据传送结束时才中断CPU。通道方式是当1组数据块传送完毕后，再请求CPU的干预，可以有效实现CPU、通道和I/O设备三者的并行操作。","images":[],"tables":[]},{"num":68,"type":"choice","source":"考研真题","stem":"程序员利用系统调用打开I/O设备时，通常使用的设备标识是（   ）。","options":[{"label":"A","text":"逻辑设备名"},{"label":"B","text":"物理设备名"},{"label":"C","text":"主设备号"},{"label":"D","text":"从设备号"}],"answer":"A","explanation":"用户程序对I/O设备的请求采用逻辑设备名，而在程序实际执行时使用物理设备名。","images":[],"tables":[]},{"num":69,"type":"choice","source":"","stem":"设备管理程序对设备的分配和控制是借助一些表格进行的，下面的表格中（   ）不属于设备管理程序。","options":[{"label":"A","text":"JCB"},{"label":"B","text":"DCT"},{"label":"C","text":"COCT"},{"label":"D","text":"CHCT"}],"answer":"A","explanation":"JCB（job control block）为作业控制块。多道批处理系统中每个作业一个JCB，它保存了系统对作业管理和调度的全部信息，与设备分配无关。DCT（device control table）设备控制表，记录设备分配中每个设备的情况。COCT（controller contro table）是控制器控制表，记录与设备相连的控制器的使用情况。CHCT（channel control table）为通道表。","images":[],"tables":[]},{"num":70,"type":"choice","source":"","stem":"中央处理器启动通道后，设备的控制工作是由（   ）。","options":[{"label":"A","text":"中央处理器执行程序来控制的"},{"label":"B","text":"中央处理器执行通道程序来控制的"},{"label":"C","text":"通道执行预先编好的通道程序来控制的"},{"label":"D","text":"通道执行用户程序来控制的"}],"answer":"C","explanation":"通道接收到CPU指令后，从通道地址字中取出通道程序的首地址，并根据首地址取出第一条指令放入控制寄存器中，同时向CPU发回答信号，使CPU继续执行其他程序，而通道则开始执行通道程序，完成传输工作。","images":[],"tables":[]},{"num":71,"type":"choice","source":"考研真题","stem":"操作系统中的SPOOLing技术，实质是将（   ）转化为共享设备的技术。","options":[{"label":"A","text":"虚拟设备"},{"label":"B","text":"独占设备"},{"label":"C","text":"脱机设备"},{"label":"D","text":"块设备"}],"answer":"B","explanation":"SPOOLing的核心思想是利用磁盘（输入井、输出井）来模拟独占设备的操作，使一台独占设备变成多台可并行的虚拟设备。用户向独占设备提交的请求实际上被提交到输入或输出井里面。从输入/输出井到实际物理独占设备的数据传输由SPOOLing进程统一控制和调度。","images":[],"tables":[]},{"num":72,"type":"choice","source":"考研真题","stem":"为了缓和CPU和I/O设备间速度不匹配的矛盾，提高CPU和I/O设备的并行性，现代操作系统关于I/O设备与处理机之间的数据交换几乎都用到了（   ）。","options":[{"label":"A","text":"临界区"},{"label":"B","text":"缓冲区"},{"label":"C","text":"对换区"},{"label":"D","text":"工作集"}],"answer":"B","explanation":"引入缓冲区可以在高速和低速设备之间起一个速度平滑作用，用于暂时存储数据，经常访问的数据可以放进缓冲区，减少对慢速设备的访问等待，以提高系统效率。","images":[],"tables":[]},{"num":73,"type":"choice","source":"","stem":"对磁盘进行移臂调度其目的是缩短（   ）时间。","options":[{"label":"A","text":"启动"},{"label":"B","text":"数据传送"},{"label":"C","text":"寻道定位"},{"label":"D","text":"旋转延迟"}],"answer":"C","explanation":"磁盘读取数据中包含启动时间、寻找磁道的寻找定位时间，寻找磁盘的旋转延迟时间以及数据传送时间。其中移臂调度算法的目的是为了减少磁头寻道移动距离，缩短寻找定位时间。","images":[],"tables":[]},{"num":74,"type":"choice","source":"考研真题","stem":"假设磁头当前位于第105道，正在向磁道号增加的方向移动。现有一个磁道访问请求序列为35、45、12、68、110、180、170、195，采用SCAN调度（电梯调度）算法得到的磁道访问序列是（   ）。","options":[{"label":"A","text":"110、170、180、195、68、45、35、12"},{"label":"B","text":"110、68、45、35、12、170、180、195"},{"label":"C","text":"110、170、180、195、12、35、45、68"},{"label":"D","text":"12、35、45、68、110、170、180、195"}],"answer":"A","explanation":"SCAN调度算法在磁头当前移动方向上选择与当前磁头所在磁道距离最近的请求作为下一次服务对象。当前磁道向序号增加的方向移动，当前位于第105道，则距离最近的下一个应该是第110磁道，依次递增到最高195，再向序号减少的方向移动，离当前195磁道最近的是68号磁道，依次递增到所有的请求完成，所以磁道访问序列为110、170、180、195、68、45、35、12。","images":[],"tables":[]},{"num":75,"type":"choice","source":"","stem":"设磁盘的转速为3000转/分钟，盘面划分成10个扇区，则读取一个扇区的时间为（   ）。","options":[{"label":"A","text":"20ms"},{"label":"B","text":"3ms"},{"label":"C","text":"2ms"},{"label":"D","text":"1ms"}],"answer":"C","explanation":"转速3000转/分钟，则1转需时60000/3000=20ms，一个磁道分成10个扇区，则读取一个扇区需时20ms/10=2ms。","images":[],"tables":[]},{"num":76,"type":"choice","source":"考研真题","stem":"从用户的角度看，文件系统主要是实现（  ）。","options":[{"label":"A","text":"数据存储"},{"label":"B","text":"数据保护"},{"label":"C","text":"数据共享"},{"label":"D","text":"按名存取"}],"answer":"D","explanation":"用户只需要向系统提供所需要访问的文件名称，就可以快速准确的找到指定文件在外存上的存储位置，这是文件系统向用户提供的最基本服务。","images":[],"tables":[]},{"num":77,"type":"choice","source":"考研真题","stem":"逻辑文件是（   ）的文件组织形式。","options":[{"label":"A","text":"在外部设备上"},{"label":"B","text":"从用户观点出发"},{"label":"C","text":"虚拟存储"},{"label":"D","text":"目录"}],"answer":"B","explanation":"逻辑文件是从用户观点看的文件组织形式，是用户可以直接处理的数据及结构。","images":[],"tables":[]},{"num":78,"type":"choice","source":"考研真题","stem":"数据库文件的逻辑结构形式是（   ）。","options":[{"label":"A","text":"字符流式文件"},{"label":"B","text":"档案文件"},{"label":"C","text":"记录式文件"},{"label":"D","text":"只读文件"}],"answer":"C","explanation":"文件的逻辑结构是指文件的数据组织形式，可以分为有结构的记录式文件和无结构的字符流式文件。数据库文件的逻辑结构形式是有结构的记录式文件。","images":[],"tables":[]},{"num":79,"type":"choice","source":"考研真题","stem":"使用绝对路径名访问文件是从（   ）开始按目录结构访问某个文件。","options":[{"label":"A","text":"当前目录"},{"label":"B","text":"用户主目录"},{"label":"C","text":"根目录"},{"label":"D","text":"父目录"}],"answer":"C","explanation":"绝对路径名是从根目录开始到数据文件为止所构成的路径名称；相对路径是从当前目录开始到数据文件为止所构成的路径名称。","images":[],"tables":[]},{"num":80,"type":"choice","source":"","stem":"从下面关于目录检索的论述中，（   ）的论述正确。","options":[{"label":"A","text":"由于Hash法具有较快的检索速度，故现代操作系统中已开始用它取代传统的顺序检索法"},{"label":"B","text":"在利用顺序检索法时，对树型目录应采用文件的路径名，且应从根目录开始逐级检索"},{"label":"C","text":"在顺序检索法的查找过程中，只要有一个文件分量名未能找到，便应停止查找"},{"label":"D","text":"在顺序检索法的查找完成时，即应得到文件的物理地址"}],"answer":"C","explanation":"顺序检索法也称为线性检索法。在单级目录中，根据用户提供的文件名，直接从文件目录中找到指名文件的目录项。在树型目录中，用户提供的文件名是多个文件分量名组成的路径名，此时要从路径中的第1个文件分量名开始在对应目录项中顺序比较，找出匹配者，直到最后1个分量名查找结束。如果在顺序查找过程中发现有1个文件分量名未能找到，则应停止查找，并返回“文件未找到”信息。","images":[],"tables":[]},{"num":81,"type":"choice","source":"","stem":"在图示的树形目录结构中，Wang用户需要经常性地访问Zhang用户的/Zhang/ Course/ Course1/f1文件，他可以通过（   ）来提高检索速度并简化操作过程。","options":[{"label":"A","text":"将这个文件复制到Wang目录下，并仍使用原来的文件名"},{"label":"B","text":"将这个文件复制到Wang目录下，但不能使用原来的文件名"},{"label":"C","text":"将这个文件链接到Wang目录下，并仍使用原来的文件名"},{"label":"D","text":"将这个文件链接到Wang目录下，但不能使用原来的文件名"}],"answer":"D","explanation":"链接就是对文件的引用，通过链接可以让链接文件同原始文件一样对待。链接可以被执行、编辑和访问。由于Wang目录下有名字为f1的文件，因此链接/Zhang/ Course/ Course1/f1文件时，要改名字。","images":[],"tables":[]},{"num":82,"type":"choice","source":"","stem":"如果采用符号链接的方式共享文件，那么当文件被删除的时候，该共享链接会（   ）。","options":[{"label":"A","text":"不受影响"},{"label":"B","text":"失效"},{"label":"C","text":"被一起删除"},{"label":"D","text":"指向其他文件"}],"answer":"B","explanation":"在利用符号链方式实现文件共享时，只有文件主才拥有指向其索引结点的指针。其他共享用户只有该文件的路径名。当文件主删除共享文件后，其他用户访问它时，共享链接失效，访问失败。","images":[],"tables":[]},{"num":83,"type":"choice","source":"","stem":"以下有关文件的叙述中正确的是（   ）。","options":[{"label":"A","text":"有结构文件中的索引文件既可以满足文件动态增长的要求，又可以实现随机存取"},{"label":"B","text":"顺序文件中的记录即适合顺序存取，也适合随机存取"},{"label":"C","text":"一般来说，一级文件目录结构中的目录表存放在内存中"},{"label":"D","text":"顺序存取方法是按记录编号存取文件任一记录"}],"answer":"A","explanation":"索引文件是为每个文件建立一张索引表，每个表项记录指向主文件中的每条记录指针，因此索引表是个定长记录的顺序文件，可随机存取。顺序文件结构对于定长记录可实现随机和顺序存取，变长记录只能顺序存取，不适合随机存取。目录表不论采用何种结构，通常存放在外存，但为了提高查找的速度，一些系统在内存中开辟了固定区域，将正在访问的文件的目录表的内容放入该区。顺序存取是按照文件的逻辑地址进行顺序存取，在记录式文件中，是按记录排列顺序存取。随机存取是按照记录的编号存取文件的任一条记录。因此本题A正确。","images":[],"tables":[]},{"num":84,"type":"choice","source":"","stem":"以下有关文件的叙述中错误的是（   ）。","options":[{"label":"A","text":"为文件设置口令可实现对文件的保密"},{"label":"B","text":"计算机组织、存取和保存信息是通过文件系统实现的"},{"label":"C","text":"文件的透明存取，使用户既可以看到文件的逻辑结构，又可以知道它的物理结构和查找方法"},{"label":"D","text":"UNIX操作系统和 MS-DOS等都采用无结构（流式）文件。"}],"answer":"B","explanation":"为文件设置口令的方式可以实现文件保密，但性能较差，一旦口令被别人掌握，就可以获得与文件主同样的权利，所以要经常更改口令。文件的透明存取，是指用户无须了解文件存放的物理结构和查找方法等与存取介质有关的内容，只须给定文件名，文件系统就会自动完成给定文件的有关操作，因此B错误。从逻辑结构上讲，UNIX和 MS-DOS这两个系统是字符流组成的无结构文件。","images":[],"tables":[]},{"num":85,"type":"choice","source":"考研真题","stem":"利用（   ）实现文件共享时，只有文件主才拥有其索引结点的指针、而共享同一文件的其他用户仅拥有对应文件的路径名，故而不会造成文件主删除共享文件后遗留悬空指针的问题。","options":[{"label":"A","text":"进程控制块"},{"label":"B","text":"共享存储器"},{"label":"C","text":"索引结点"},{"label":"D","text":"符号链"}],"answer":"D","explanation":"索引结点共享方式中，索引节点存放诸如文件的物理地址及其他文件属性等信息。符号链的索引结点中，共享该文件的其他用户则只有该文件的路径名，其索引也要耗费一定的磁盘空间。","images":[],"tables":[]},{"num":86,"type":"choice","source":"","stem":"在 Linux中，设文件F1的当前链接计数为1，先建立F1的符号链接文件F2，再建立F1的硬链接文件F3，则此时文件F1、F2和F3的链接计数值分别是（   ）。","options":[{"label":"A","text":"1、1、1"},{"label":"B","text":"2、1、2"},{"label":"C","text":"2、2、2"},{"label":"D","text":"3、1、2"}],"answer":"B","explanation":"设文件F1的当前引用计数值为1，建立符号链接（软链接）时，引用计数值直接复制，因此F2的引用计数值为1；建立硬链接时，引用计数值加1，F1和F3均为2。","images":[],"tables":[]},{"num":87,"type":"choice","source":"","stem":"有一个长度为3200个字节的流式文件要存储在磁盘上，磁盘的每块可以存放512个字节，该文件至少（  ）块。","options":[{"label":"A","text":"5"},{"label":"B","text":"6"},{"label":"C","text":"7"},{"label":"D","text":"3000"}],"answer":"C","explanation":"3000/512商为6，余数为128，因此需要7块。","images":[],"tables":[]},{"num":88,"type":"choice","source":"考研真题","stem":"按文件的物理组织结构可将文件分成（  ）等。","options":[{"label":"A","text":"数据文件、命令文件、文本文件"},{"label":"B","text":"命令文件、库文件、索引文件"},{"label":"C","text":"连续文件、链式文件、索引文件"},{"label":"D","text":"输入文件、输出文件、随机文件"}],"answer":"C","explanation":"按文件的物理组织结构可将文件分成顺序文件（连续文件）、链接文件（链式文件）、索引文件和直接文件。","images":[],"tables":[]},{"num":89,"type":"choice","source":"考研真题","stem":"采用直接存取方法来读写硬盘上的物理记录时，效率最低的文件结构是（  ）。","options":[{"label":"A","text":"连续文件"},{"label":"B","text":"索引文件"},{"label":"C","text":"链接文件"},{"label":"D","text":"索引连续文件"}],"answer":"C","explanation":"采用直接存取法来读写硬盘上的物理记录时，效率最高的是索引文件，其次是连续文件，效率最低的是链接文件。","images":[],"tables":[]},{"num":90,"type":"choice","source":"考研真题","stem":"设文件索引节点中有7个地址项，其中4个地址项为直接地址索引，2个地址项是一级间接地址索引，1个地址项是二级间接地址索引，每个地址项大小为4字节，若磁盘索引块和磁盘数据块大小均为256字节，则可表示的单个文件的最大长度是（  ）。","options":[{"label":"A","text":"33KB"},{"label":"B","text":"519KB"},{"label":"C","text":"1057KB"},{"label":"D","text":"16513KB"}],"answer":"C","explanation":"单个文件的最大长度为(4×256+2×256/4)×256+1×(256/4)×(256/4)×256 =1057KB。","images":[],"tables":[]},{"num":91,"type":"choice","source":"","stem":"若用8个字（字长32位）组成的位示图管理内存，假定用户归还块号为100的内存块时，它对应位示图的位置为（  ）。","options":[{"label":"A","text":"字号为3，块号为5"},{"label":"B","text":"字号为4，块号为4"},{"label":"C","text":"字号为3，块号为4"},{"label":"D","text":"字号为4，块号为5"}],"answer":"B","explanation":"块号为100的内存块回收时，其对应的行号为：(100-1)DIV 32+1=4；对应的列号为：(100-1)MOD 32+1=4，因此字号为4，块号为4。","images":[],"tables":[]},{"num":92,"type":"choice","source":"","stem":"下列方式中，（  ）不能改善磁盘系统的可靠性。","options":[{"label":"A","text":"廉价磁盘冗余阵列"},{"label":"B","text":"磁盘容错技术"},{"label":"C","text":"磁盘高速缓存"},{"label":"D","text":"后备系统"}],"answer":"C","explanation":"磁盘高速缓存是提高磁盘I/O速度的途径。","images":[],"tables":[]},{"num":93,"type":"choice","source":"","stem":"从下面关于索引文件的论述中，正确的是（  ）。","options":[{"label":"A","text":"在索引文件中，索引表的每个表项中仅保存相应记录的关键字"},{"label":"B","text":"对顺序文件进行检索时，首先从FCB中读出文件的第一个盘块号；而对索引文件进行检索时，应先从FCB中读出文件索引表的始址"},{"label":"C","text":"文件系统为每个文件创建一张打开文件表，存放文件数据块的磁盘存放位置"},{"label":"D","text":"在文件较大时，无论进行顺序存取还是随机存取，通常都以索引文件方式为最快"}],"answer":"B","explanation":"索引文件中，索引表的每个表项中含有相应记录的关键字和该记录的物理地址。打开文件表仅存放已打开文件信息的表，将指定文件属性从外存复制到内存，再使用改文件时直接返回索引。在文件较大时，索引文件方式速度快是因为可以采取随机存取方法。","images":[],"tables":[]},{"num":94,"type":"choice","source":"","stem":"从下面的论述中错误的论述是（  ）。","options":[{"label":"A","text":"虚拟盘是一种易失性存储器，因此它通常只用于存放临时文件"},{"label":"B","text":"优化文件物理块的分布可显著地减少寻道时间，因此能有效地提高磁盘I/O的速度"},{"label":"C","text":"对随机访问的文件，可通过提前读提高对数据的访问速度"},{"label":"D","text":"延迟写可减少启动磁盘的次数，因此能等效地提高磁盘I/O的速度"}],"answer":"C","explanation":"若采用随机访问，无法预知下一次要读的盘块，因此不可采用提前读提高数据的访问速度。","images":[],"tables":[]},{"num":95,"type":"choice","source":"","stem":"设有一个记录文件，采用链接分配方式，逻辑记录的固定长度为120B，盘块大小为512B。若该文件的目录项已经读入内存，则对第25个记录完成修改后，共启动磁盘（  ）次。","options":[{"label":"A","text":"5"},{"label":"B","text":"6"},{"label":"C","text":"7"},{"label":"D","text":"8"}],"answer":"C","explanation":"第25个逻辑记录对应5个物理块（⌊25120/512⌋=5，(25120)%512=440）即在第6个物理块中，由于文件采用链接文件的物理结构，因此要从目录项所指第一个物理块开始顺序读取，共启动6次磁盘，完成修改后还须要写回记录，写回时已获得该块的物理地址，只需1次访问磁盘。因此共启动磁盘7次。","images":[],"tables":[]},{"num":96,"type":"choice","source":"考研真题","stem":"磁盘高速缓存设在（  ）中。","options":[{"label":"A","text":"内存"},{"label":"B","text":"磁盘控制器"},{"label":"C","text":"Cache"},{"label":"D","text":"磁盘"}],"answer":"A","explanation":"磁盘高速缓存是指在内存中为磁盘盘块设置的缓冲区，在缓冲区中保存了某些盘块的副本。","images":[],"tables":[]},{"num":97,"type":"choice","source":"考研真题","stem":"在系统内存中设置磁盘缓冲区的主要目的是（  ）。","options":[{"label":"A","text":"减少磁盘I/O次数"},{"label":"B","text":"减少平均寻道时间"},{"label":"C","text":"提高磁盘数据可靠性"},{"label":"D","text":"实现设备无关性"}],"answer":"A","explanation":"访问磁盘的开销远远大于访问内存的开销。磁盘缓冲区便是利用主存中的存储空间，来暂存从磁盘中读出（或写入）的信息，频繁使用的一部分磁盘数据和信息，暂时存放在磁盘缓存中，可减少访问磁盘的次数。","images":[],"tables":[]},{"num":98,"type":"choice","source":"考研真题","stem":"下列选项中，不能改善磁盘设备I/O性能的是（  ）。","options":[{"label":"A","text":"重排I/O请求次序"},{"label":"B","text":"在一个磁盘上设置多个分区"},{"label":"C","text":"预读和滞后写"},{"label":"D","text":"优化文件物理块的分布"}],"answer":"B","explanation":"重排I/O请求次序、预读和滞后写、优化文件物理的分布都能够改善磁盘设备的I/O性能。在一个磁盘上设置多个分区，不能够改善磁盘的I/O性能。","images":[],"tables":[]},{"num":99,"type":"choice","source":"考研真题","stem":"下列优化方法中，可以提高文件访问速度的是（  ）。\nⅠ.提前读\tⅡ.为文件分配连续的簇     Ⅲ.延迟写\t   Ⅳ.采用磁盘高速缓存","options":[{"label":"A","text":"仅Ⅰ、Ⅱ"},{"label":"B","text":"仅Ⅱ、Ⅲ"},{"label":"C","text":"仅Ⅰ、Ⅲ、Ⅳ"},{"label":"D","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"}],"answer":"D","explanation":"提前读是指在读当前盘块的同时，将下一个可能访问的盘块中的数据也读入缓冲区，当下一次要读该盘块中的数据时，可以直接从缓冲区中取出数据，提高了文件访问速度。为文件分配连续的簇是优化物理块的分布，消除了磁头在磁道间的移动，提高了文件访问速度。延迟写是指不立即将写数据写回磁盘，而是先写入缓冲区，当缓冲区需要再次被分配出去时才将缓冲区数据写回磁盘，减少了访问磁盘的次数，提高了文件访问速度。采用磁盘高速缓存，将常用的文件存储在高速缓存中，节省了重复査找时间，从而提高了文件访问速度。","images":[],"tables":[]},{"num":100,"type":"choice","source":"考研真题","stem":"对于以扇区（512字节）作为基本分配单位的FAT12文件系统（文件分配表的表项为12位），其所支持的磁盘分区容量为（  ）字节。","options":[{"label":"A","text":"256K"},{"label":"B","text":"4M"},{"label":"C","text":"2M"},{"label":"D","text":"8M"}],"answer":"C","explanation":"每个FAT表项12位，则FAT表中最多允许212=4096个表项，如果采用盘块作为基本分配单位，每个盘块大小512字节，则每个表项记录1个盘块的物理地址，所支持磁盘分区容量为212×512B=2MB。","images":[],"tables":[]},{"num":101,"type":"blank","source":"","stem":"实时系统应具有的两个基本特征是（   ）和（   ）。","answerText":"答案：及时性；可靠性","explanation":"实时系统是针对实时控制系统和实时信息查询系统的需要而设计的。实时系统能及时响应外部事件的请求，在规定的时间内完成对该事件的处理。因此实时系统必须具有很强的实时时钟管理功能和过载保护能力。因此它的特性为及时性和高可靠性。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":102,"type":"blank","source":"","stem":"为实现CPU与外部设备的并行工作，（   ）是系统必须引入的一种机制。","answerText":"答案：中断机制","explanation":"要使CPU与外部设备并行工作，系统必须处于一个多道程序运行环境，这样才能使某进程I/O操作的同时，CPU处理其他的进程。在多道程序运行环境中，外部设备完成一项I/O操作后，须要立即让CPU感知该事件的出现，使系统实现进程切换。因此系统要引入中断机制，实现CPU与外部设备的并行。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":103,"type":"blank","source":"","stem":"多道批处理系统的硬件支持是20世纪60年代发展起来的（   ）和（   ）。","answerText":"答案：通道；中断机制","explanation":"多道程序并发执行的目的是使外部设备和CPU并行工作，提高资源利用率。为使外部设备和CPU并行工作，首先必须引入中断机制，使得外部设备工作完成后能通知 CPU，完成进程切换，保证I/O操作的进程能继续运行。为了减少CPU对I/O的管理，增加了一个I/O处理机—通道。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":104,"type":"blank","source":"","stem":"操作系统为用户提供了两种类型的接口，分别是（   ）和（   ）。","answerText":"答案：命令接口；程序接口","explanation":"OS为用户提供了两种类型的接口：一种是命令接口，用户利用它来组织和控制作业的执行或管理计算机系统；另一种是程序接口，编程人员使用它们来请求OS提供的服务。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":105,"type":"blank","source":"","stem":"用户为阻止进程继续执行，应利用（   ）原语，若进程正在执行，应转变为（   ）状态；以后，若用户要恢复其运行，应利用（   ）原语，此时进程应转变为（   ）状态。","answerText":"答案：阻塞；阻塞；唤醒；就绪","explanation":"当正在执行的进程须要等待某种事件的完成或本身无新工作可做时，应调用阻塞原语将自己从执行态转换为阻塞态。当阻塞进程所等待事件完成时，应调用唤醒原语将该进程的状态从阻塞态转换成就绪状态。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":106,"type":"blank","source":"","stem":"PCB的初始化包括（   ）。","answerText":"答案：进程标识符信息；处理机状态信息和处理机控制信息","explanation":"在PCB中包含了进程的所有控制信息。这些信息可大体分为3类：进程标识符信息、处理机状态信息和处理机控制信息。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":107,"type":"blank","source":"","stem":"进程的并发性是指多个进程在（   ）内同时发生。","answerText":"答案：同一时间间隔","explanation":"进程的并发性是指多个进程在同一时间间隔内同时发生。单CPU系统不可能存在多个进程在同一时刻同时发生的现象。并发执行的各进程执行没有固定的顺序。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":108,"type":"blank","source":"","stem":"进程的执行并不是“一气呵成”，而是走走停停的，这种特征称为进程的（   ）。","answerText":"答案：异步性","explanation":"各并发进程按各自独立的、不可预知的速度向前推进。这种特性称为进程的异步性。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":109,"type":"blank","source":"","stem":"下列作业调度算法中，（   ）具有最短的作业平均周转时间。","answerText":"答案：短作业优先调度算法","explanation":"短作业优先算法是优先选择计算时间短且资源能够得到满足的作业进行调度。因为作业的平均周转时间为各作业周转时间除以作业个数。短作业优先算的作业周转时间之和最短，因此，该算法的平均周转时间为最短。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":110,"type":"blank","source":"","stem":"在多进程并发执行中，肯定不会因竞争（   ）而发生死锁。","answerText":"答案：CPU","explanation":"CPU为可剥夺资源，竞争可剥夺资源不会发生死锁。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":111,"type":"blank","source":"","stem":"死锁的产生有4个必要条件，在死锁的预防策略中，资源的有序分配策略可以破坏（   ）条件。","answerText":"答案：环路等待","explanation":"资源的有序分配策略是对资源按照某种原则进行编号，进程申请资源要按照序号由小到大或由大到小依次申请，避免了申请资源过程中形成环路。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":112,"type":"blank","source":"","stem":"银行家算法在解决死锁问题中是用于（   ）的。","answerText":"答案：避免死锁","explanation":"银行家算法用于寻找一个安全序列，系统按照安全序列的顺序分配资源，以避免死锁。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":113,"type":"blank","source":"","stem":"在利用信号量实现进程互斥时，应将（   ）置于（   ）和（   ）之间。","answerText":"答案：临界区；P操作（wait操作）；V操作（signal操作）","explanation":"在利用信号量实现进程互斥时，访问临界资源之前要执行P操作，申请资源，访问之后要执行V操作，释放资源，因此，要将临界区置于P操作和V操作之间。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":114,"type":"blank","source":"","stem":"在每个进程中访问（   ）的那段代码称为临界区。","answerText":"答案：临界资源","explanation":"在每个进程中访问临界资源的那段代码称为临界区。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":115,"type":"blank","source":"","stem":"计算机系统中，一次仅允许一个进程使用的资源，称为（   ）。","answerText":"答案：临界资源","explanation":"计算机系统中，一次仅允许一个进程使用的资源，叫做临界资源。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":116,"type":"blank","source":"考研真题","stem":"15个进程共享同一程序段，而每次最多允许4个进程进入该程序段，若用P、V操作同步机制，则记录型信号量S的取值范围为（   ）。","answerText":"答案：-11≤S≤4","explanation":"每次最多允许4个进程进入该程序段，则信号量S的初值设置为4，每一个进程执行P操作后，S的值会减1，最多15个进程，最多执行15次，S的值最小为4-15=-11。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":117,"type":"blank","source":"","stem":"把程序地址空间中使用的逻辑地址变成内存中物理地址称为（   ）。","answerText":"答案：重定位","explanation":"重定位是因为程序的逻辑地址是以0为基址进行编址的，然而在程序装到内存时，一般都不是装入到0开始的物理地址，为了保证程序运行时找到正确的物理地址，必须进行逻辑地址到物理地址的转换，即重定位。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":118,"type":"blank","source":"","stem":"在分页管理系统中，为实现地址转换设置了寄存器，其中存放的是（   ）在内存中的起始地址。","answerText":"答案：页表","explanation":"在系统中设置地址变换机构，主要是为了将程序中的逻辑地址转换为内存中的物理地址。在分页管理系统中，页表大多驻留在内存中，为实现地址转换，设置了控制寄存器，其中存放的是页表在内存中的起始地址和页表长度。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":119,"type":"blank","source":"考研真题","stem":"分页存储管理系统具有快表，内存访问时间为2μs，检索快表时间为0.5μs。若快表的命中率为80%，且忽略快表更新时间，则有效访问时间是（   ）μs。","answerText":"答案：2.9μs","explanation":"在引入快表的分页存储管理系统中，有效访问时间的计算公式为：\nEAT=a×λ+(t+λ) ×(1-a)+t=2t+λ-t×a\n其中，t为内存访问时间，t=2μs；λ为检索快表的时间，λ=0.5μs；a为快表的命中率，a=80%。代入数据，得有效访问时间EAT=2.9μs。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":120,"type":"blank","source":"","stem":"在具有两级页表的分页存储管理系统中，CPU每次要存取一个数据时，必须访问（   ）次内存。","answerText":"答案：3","explanation":"两级页表中，CPU存取一个数据要访问3次内存。第1次访问一级页表，第2次获得二级页表，第3次存取数据。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":121,"type":"blank","source":"","stem":"某段式存储管理系统中，地址长度为32位，若允许的最大段长为64KB，则段号占（   ）位。","answerText":"答案：16","explanation":"分段地址结构由段号和段内地址组成，由于允许的最大段长是64KB=216B，那么段内地址占16位，则段号占32-16=16位。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":122,"type":"blank","source":"","stem":"虚拟存储器的基本特征是（    ）、（    ）和（    ），因而决定了实现虚拟存储器的关键技术是（    ）和（    ）。","answerText":"答案：多次性；对换性；虚拟性；请求调页（段）；页（段）置换","explanation":"与传统的存储器管理方式比较，虚拟存储器具有多次性，对换性和虚拟性，从而也决定了实现虚拟存储器的关键技术就是为了实现请求调页（段）和页面（段）置换的功能。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":123,"type":"blank","source":"","stem":"实现页式虚拟存储器，除了需要有一定容量的内存和相当容量的外存外，还需要有（    ）、（    ）和（    ）的硬件支持。","answerText":"答案：页表机制；地址变换机构；缺页中断机构","explanation":"为了实现请求分页，系统必须提供一定的硬件支持。除了需要有一定容量的内存和相当容量的外存外，还需要有请求页表机制、缺页中断机构和地址变换机构。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":124,"type":"blank","source":"考研真题","stem":"在请求分页存储管理中，逻辑地址长度为16位，每页为2KB，部分页表如表所示。\n则逻辑地址0EC5H所对应的物理地址为（    ）H。","answerText":"答案：56C5","explanation":"请求分页存储管理方式中分页地址结构，由页号和偏移量（页内地址）构成。由每页2KB的页面大小可以得出，页内地址占分页地址的低地址开始11位。由0EC5（H）得其二进制地址为0000 1110 1100 0101，则页内地址为110 1100 0101，高地址部分表示页号为00001，得页号为1，查表可得对应的物理块号为10（十进制）。10转化为二进制为1010，由物理地址=块号×页面大小+偏移量（页内地址）得：1010×211+110 1100 0101=0101 0110 1100 0101=56C5 H。","images":[],"tables":[[["页号","物理块号"],["0","4"],["1","10"],["2","6"],["3","2"]]],"ans_images":[],"ans_tables":[]},{"num":125,"type":"blank","source":"","stem":"为实现请求分页管理，应在基本分页的页表基础上增加（    ）、（    ）、（    ）和（    ）等数据项。","answerText":"答案：状态位；访问字段；修改位；外存地址","explanation":"为了满足页面换进换出的需要，在请求页表中又增加了4个字段，包括状态位、访问字段、修改位、外存地址。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":126,"type":"blank","source":"","stem":"磁盘属于（   ）设备，其信息的存取是以（   ）为单位的；磁盘的I/O控制主要采取（   ）方式；打印机的I/O控制主要采取(   )方式。","answerText":"答案：块；数据块；中断驱动方式；DMA控制方式","explanation":"按设备信息交换的单位来划分，磁盘以固定长度的数据块为基本单位，属于块设备，打印机是字符设备。因此磁盘采用的I/O控制方式是DMA方式，而打印机则主要采取中断驱动方式。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":127,"type":"blank","source":"","stem":"独占设备是指在一个作业的整个执行期间独自占用的设备，它一般采用（   ）分配。共享设备是指在某个时间段内可由多个作业同时使用的设备，一般采用（   ）分配。","answerText":"答案：静态；动态","explanation":"独占设备采用独占分配方式或称为静态分配方式，即在一个应用程序执行前，分配它所要使用的这类设备。当应用程序处理完毕撤离时，收回分配给它的这类设备。静态分配方式实现简单，且不会发生死锁，但采用这种分配方式时外部设备利用率不高。对共享设备采用共享分配方式，即进行动态分配。当进程提出资源申请，由系统按照事先规定的策略给进程，进程使用完毕后，立即归还。动态分配方式有利于提高设备的利用率，但如果分配算法使用不当，则有可能造成进程死锁。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":128,"type":"blank","source":"","stem":"在利用RS-232接口进行通信时，其通信速率为9.6KB/S(B为Bit)。如果在通信接口中仅设置了一个8位寄存器作为缓冲寄存器，这意味着大约每隔（   ）的时间便要中断一次CPU，且要求CPU必须在（   ）时间内予以响应。","answerText":"答案：0.8ms；0.1ms","explanation":"8位寄存器作为缓冲寄存器就要传输8bit数据中断一次，所需时间为8/9.60.8ms。CPU响应时间为1/9.60.1ms","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":129,"type":"blank","source":"","stem":"转速为7200转/分钟，平均旋转延迟时间约为（   ）。","answerText":"答案：4.17","explanation":"平均旋转延迟时间为1/2r，其中r为转速。由此可知本题的结果为60000/(27200)ms4.17ms","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":130,"type":"blank","source":"考研真题","stem":"操作系统中采用缓存技术的主要目的是提高CPU和设备之间的（   ）程度。","answerText":"答案：并行","explanation":"缓冲技术是为了协调速度不匹配设备之间数据的传送所采用的技术。缓冲技术用到的缓冲区是为了缓和CPU和I/O设备的不匹配、减少对CPU的中断频率、提高CPU和I/O设备的并行性。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":131,"type":"blank","source":"","stem":"在UNIX系统中，所有的（    ）都被看成是特殊文件，它们在使用形式上与普通文件相同，但它们使用是和（    ）紧密相连的。","answerText":"答案：I/O设备；设备管理程序","explanation":"UNIX系统中的特殊文件也称设备文件。UNIX利用特殊文件作为用户与设备文件的接口，使用户访问外部设备，能像访问普通文件一样，无须知道各种设备的具体操作。特殊文件不包含任何数据，它只是在文件系统中建立了物理设备与文件名之间的映射，并提供相关的驱动程序，因此使用它们要和设备管理程序紧密相连。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":132,"type":"blank","source":"","stem":"对文件的访问有（    ）和（    ）两种方式。","answerText":"答案：顺序访问；随机访问/直接访问","explanation":"顺序访问指从第一个元素开始依次逐个读取后续数据元素。随机访问指可以随意访问文件中的任一个数据元素。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":133,"type":"blank","source":"","stem":"鉴于文件查找过程中，只有文件名对目录检索有用，所以可把文件名与文件的其它属性分离开来分别存放，把有关文件的文件名组织在一起形成符号名文件目录，而文件的其它属性则以所谓（    ）的数据结构方式集中组织在一起。","answerText":"答案：索引结点","explanation":"为了使文件的目录项更小，减少目录文件占用磁盘数目，提高文件检索效率，系统把文件名和文件其他属性分开，将文件其他属性信息单独形成一个数据结构，称为索引节点，也称为i节点。引入索引节点后，目录项仅包含文件名和指向索引节点的指针。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":134,"type":"blank","source":"考研真题","stem":"在操作系统中，FCB是指（    ）。","answerText":"答案：文件控制块","explanation":"FCB英文全称是file control lock，中文全称是文件控制块。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":135,"type":"blank","source":"考研真题","stem":"由字符序列组成，文件内的信息不再划分结构，这是指（    ）。","answerText":"答案：流式文件","explanation":"字符流的无结构文件，其长度以字节为单位。对流式文件的访问是利用读写指针指示下一个要访问的字符。大量的源程序，可执行程序，库函数等均为无结构文件。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":136,"type":"blank","source":"","stem":"文件目录是（    ）的有序集合。","answerText":"答案：文件控制块","explanation":"文件与文件控制块一一对应，为了提高文件检索效率，操作系统常将文件控制块集中管理。这种文件控制块的有序集合称为文件目录，一个文件控制块就是其中的一个文件目录项。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":137,"type":"blank","source":"","stem":"文件存储空间管理实质上是对（    ）的组织和管理。","answerText":"答案：外存空闲空间","explanation":"文件存储空间管理即文件空闲空间管理，要解决的重要问题是如何管理外存的空闲盘块，能有效为文件分配和回收存储空间，即如何找到空闲盘块，如何将释放的空闲盘块进行回收。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":138,"type":"blank","source":"","stem":"可将链接式文件中的文件内容装入到（    ）的多个盘块中，并通过（    ）将它们构成一个队列，（    ）链接文件具有较高的检索速度。","answerText":"答案：离散；链接指针；显式","explanation":"链接文件属于离散的分配方式，可将内容装入到多个不相邻接的盘块中，这些不相邻盘块通过链接指针链成一个队列。链接文件有显式链接和隐式链接两种方式，其中显式链接是把用于链接文件各物理块的指针显式地存放在内存一张链接表FAT中，每个表项中存放下一个盘块号指针，因此显示链接检索可以在内存中进行，具有较高的检索速度。隐式链接分配则是为文件分配多个离散的盘块，将下一个盘块的地址与文件的内容一起登记在文件分配到的前一个盘块中。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":139,"type":"blank","source":"考研真题","stem":"使用位示图（30行，50列）表示空闲盘块状态。如当分配一个盘块号为174时，其在位示图中的行列数为（    ）。（注：行列始下标为0）","answerText":"答案：3，23","explanation":"行号为174 DIV 50=3，列号为174 MOD 50-1=23，则行列数分别是3，23。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":140,"type":"blank","source":"","stem":"假定某盘组共有100个柱面，每个柱面上有16个磁道，每个磁道分成4个扇区。那么整个磁盘空间的存储块数共有（    ）个。若用字长32位单元构造位示图，需要（    ）个字。","answerText":"答案：6400；200","explanation":"整个磁盘空间的存储块数为416100=6400个。位示图中应有6400个位，如果字长32位，则每行32位，共可以构造6400 /32=200个字，即200行。","images":[],"tables":[],"ans_images":[],"ans_tables":[]},{"num":141,"type":"judge","source":"考研真题","stem":"在过去很长一段时间内，鉴于计算机系统非常昂贵，所以有效性曾一度是操作系统最为重要的设计目标。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"在计算机系统比较昂贵的时期，OS设计主要目标为了满足资源的有效使用，所以有效性是重要设计目标。","images":[],"tables":[]},{"num":142,"type":"judge","source":"","stem":"操作系统的所有程序都必须常驻内存。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"只有OS的部分内核程序才须要常驻内存。","images":[],"tables":[]},{"num":143,"type":"judge","source":"","stem":"采用多道程序设计的系统中，系统中的程序道数越多，系统的效率越高。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"系统的效率并不因系统中程序道数的增多而提高；相反，当系统中程序道数过多时，由于用于管理和协调这些程序的时间增加，系统的效率反而会下降。","images":[],"tables":[]},{"num":144,"type":"judge","source":"考研真题","stem":"多道程序的并发执行失去了封闭性和可再现性，因此多道程序设计中无需封闭性和可再现性。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"封闭性指的是程序一旦开始执行，其计算结果就取决于程序本身，不受外界因素影响。可再现性是指当程序重复执行多次时，必将得到相同结果。多道并发执行的时候可能失去封闭性和可再现性，但可再现性是程序设计必须需要的。","images":[],"tables":[]},{"num":145,"type":"judge","source":"考研真题","stem":"批处理系统不允许用户随时干预自己程序的执行。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"批处理系统中把一批作业一起交给系统，中间用户不能进行干预。","images":[],"tables":[]},{"num":146,"type":"judge","source":"","stem":"操作系统内核能使用特权指令。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"OS内核可以使用所有指令，包括特权指令。","images":[],"tables":[]},{"num":147,"type":"judge","source":"","stem":"通常将CPU模式分为内核态（核心态）和用户态，这样做的目的是为了提高运行速度。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"通常CPU状态分为内核态（核心态）和用户态，这样做的目的是为了提高OS的安全性。","images":[],"tables":[]},{"num":148,"type":"judge","source":"","stem":"用户程序有时也可以在内核态下运行。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"用户程序只能在用户态下运行。","images":[],"tables":[]},{"num":149,"type":"judge","source":"考研真题","stem":"微内核是指精心设计的、能够提供现代操作系统核心功能的小型内核，其通常运行在系统态，而且开机启动后常驻内存，不会因内存紧张而换出到外存。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"微内核是指精心设计的、能够提供现代OS核心功能的小型内核，这也是微内核的设计初衷，保留尽可能少的功能，通常运行在系统态，而且开机启动后常驻内存，不会因内存紧张而换出到外存。","images":[],"tables":[]},{"num":150,"type":"judge","source":"","stem":"系统调用与程序级的子程序调用是不同的。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"系统调用与程序级的子程序调用是不同的，前者导致CPU由用户态到内核态，后者通常不会；前者的代码与调用者的程序代码是分开、独立的，而后者的代码与调用者的程序代码在同一进程地址空间。","images":[],"tables":[]},{"num":151,"type":"judge","source":"","stem":"不同的进程必然对应不同的程序。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"进程是程序的一次执行，不同的进程可以包含同一个程序，同一个程序在执行中也可以产生多个进程。","images":[],"tables":[]},{"num":152,"type":"judge","source":"","stem":"并发是并行的不同表述，其原理相同。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"并发是指多道程序的执行在一个时间段中是重叠的，一个程序的执行尚未结束，另一个程序的执行已经开始。即对单CPU而言，每一时刻只能有一个程序在占有CPU运行，但与此同时可以有其他程序在做输入或输出操作，这就是并发“在宏观上并行执行，在微观上交替执行”的含义。而并行是真正的同时执行，因此两者的含义是不同的。","images":[],"tables":[]},{"num":153,"type":"judge","source":"考研真题","stem":"某用户两次运行Word软件查看同一个文档，因为运行的程序和操作的数据均相同，所以系统两次运行Word对应的是同一个进程。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"程序的一次运行就会创建一个进程，两次运行对应的是两个进程。","images":[],"tables":[]},{"num":154,"type":"judge","source":"考研真题","stem":"在PCB中可以直接或间接找到有关该进程的所有信息。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"PCB是进程存在的唯一标志，创建进程是申请一个空白的PCB，并向其中填写一些控制和管理进程的信息。","images":[],"tables":[]},{"num":155,"type":"judge","source":"考研真题","stem":"进程由PCB和其执行的程序、数据所组成。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"进程由PCB和程序段、数据段组成。","images":[],"tables":[]},{"num":156,"type":"judge","source":"考研真题","stem":"进程的3种基本状态：就绪、运行和阻塞，任意两种状态之间都可以相互转换。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"3种基本状态之间转换共有4种，有2种是不可以的，就绪不能转换到阻塞，阻塞不能转换到执行状态，故本题错误。","images":[],"tables":[]},{"num":157,"type":"judge","source":"","stem":"进程状态的转换是由操作系统完成的，对用户是透明的。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"因为是由OS来调度进程、执行相应的转换原语，对用户是透明的。","images":[],"tables":[]},{"num":158,"type":"judge","source":"","stem":"当条件满足时，进程可以由阻塞态直接转换为运行态。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"进程从阻塞状态不能转换为运行状态，阻塞态当等待的事件发生时，会转为就绪态。","images":[],"tables":[]},{"num":159,"type":"judge","source":"考研真题","stem":"在进程-线程机制中引入了线程，进程与它的线程们在同一逻辑地址空间，但却不适合多核CPU系统。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"无论是单核CPU系统，还是多核CPU系统，都适合多线程机制。","images":[],"tables":[]},{"num":160,"type":"judge","source":"","stem":"内核态线程的切换都需要内核的支持。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"内核态线程的切换（调度）必须由内核程序完成，即需要内核的支持。","images":[],"tables":[]},{"num":161,"type":"judge","source":"","stem":"作业一旦被作业调度选中，系统就给它分配CPU。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"作业被作业调度程序选中，说明作业进入内存并创建了进程。但属于该作业的进程可能处于运行、就绪或等待状态，只有处于运行状态的进程才能占有处理机，而其余两种状态的进程并不占有处理机。","images":[],"tables":[]},{"num":162,"type":"judge","source":"","stem":"交互式作业不存在作业调度问题。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"交互式系统中只有进程调度，没有作业调度。","images":[],"tables":[]},{"num":163,"type":"judge","source":"","stem":"优先权调度算法中，在考虑静态优先权时，一般计算进程的优先权高于磁盘I/O进程的优先权。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"通常系统进程的优先权高于用户进程的优先权，磁盘I/O进程是系统进程。为保证多进程并发执行，通常先启动I/O，再启动计算进程。","images":[],"tables":[]},{"num":164,"type":"judge","source":"","stem":"进程的调度算法有很多，如果选择不当，就会造成死锁。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"如采进程调度算法不当，会造成某此进程长期处于就绪态，与死锁无关。","images":[],"tables":[]},{"num":165,"type":"judge","source":"","stem":"当进程数大于资源数时，进程竞争资源必然产生死锁。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"当进程数大于资源数时，如果资源分配得当，则进程即便竞争资源也不会产生死锁。","images":[],"tables":[]},{"num":166,"type":"judge","source":"","stem":"一旦出现死锁，所有进程都不能运行。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"系统出现死锁是指系统内部分进程因相互等待对方资源而处于死锁状态，而不一定是全部进程都死锁。","images":[],"tables":[]},{"num":167,"type":"judge","source":"","stem":"当有m个进程的操作系统出现死锁时，死锁进程的个数为1<k≤m。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"由于处于死锁状态的进程都在相互等待对方占用的资源，因此处于死锁状态的进程至少有两个。如果系统的全部进程都因相互等待对方的资源而处于死锁状态，那么就会使整个系统处于瘫痪状态。","images":[],"tables":[]},{"num":168,"type":"judge","source":"","stem":"由于死锁是一种与时间有关的错误，因此它与进程推进的速度无关。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"死锁产生的根本原因之一是进程推进顺序非法，这是一种与时间有关的错误，它与进程推进的速度有关。","images":[],"tables":[]},{"num":169,"type":"judge","source":"","stem":"一个给定的进程资源分配图的全部化简序列必然导致同一个不可化简图。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"如果一个资源分配图可完全简化，则不会产生死锁；如果资源分配图不可完全简化（即：图中还有“边”存在），则会产生死锁。","images":[],"tables":[]},{"num":170,"type":"judge","source":"","stem":"对临界资源，应采用互斥访问方式来实现共享。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"计算机系统中，一次仅允许一个进程使用的资源，叫做临界资源。临界资源访问的时候，必须互斥访问。","images":[],"tables":[]},{"num":171,"type":"judge","source":"","stem":"临界区是指进程中用于实现进程互斥的那段代码。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"临界区是指访问临界资源的那段代码，不是实现进程互斥的那段代码。","images":[],"tables":[]},{"num":172,"type":"judge","source":"","stem":"经典的读者-写者问题只有进程互斥，不存在进程同步。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"经典的读者-写者问题只有进程互斥，不存在进程同步。","images":[],"tables":[]},{"num":173,"type":"judge","source":"","stem":"使用P、V操作后，可以防止系统出现死锁。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"P、V操作使用不当，也会造成进程死锁。例如哲学家进餐问题中，如果只考虑关于筷子的互斥信号量，而不考虑执行顺序，就可能会发生死锁。","images":[],"tables":[]},{"num":174,"type":"judge","source":"","stem":"管程是进程的一部分，控制进程的同步与运行。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"管程是进程同步的一种工具，不是进程的一部分。","images":[],"tables":[]},{"num":175,"type":"judge","source":"","stem":"进程的前趋图中的各个结点之间存在同步关系，也存在互斥关系。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"进程的前趋图，描述的是进程和进程之间的先后、前趋关系，各个结点之间只存在同步关系。","images":[],"tables":[]},{"num":176,"type":"judge","source":"","stem":"记录型信号量在使用过程中存在“忙等”现象。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"整型信号量存在“忙等”现象，为了解决这个问题，提出了记录型信号量，记录信号量中不存在“忙等”现象。","images":[],"tables":[]},{"num":177,"type":"judge","source":"考研真题","stem":"页表的作用是实现逻辑地址到物理地址的映射。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"页表只是实现了页号到块号的映射，逻辑地址转换为物理地址除了需要进行页号到块号的映射外，还需要依赖页内地址。","images":[],"tables":[]},{"num":178,"type":"judge","source":"","stem":"在分页式存储管理系统中，为了提高内存利用率，允许用户使用不同大小的页面。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"在分页式存储管理系统中，将进程的逻辑地址空间分成若干个大小相等的页，页面大小均相等。","images":[],"tables":[]},{"num":179,"type":"judge","source":"","stem":"页式存储管理中，一个作业可以占用不连续的内存空间，而段式存储管理中，一个作业则是占用连续的内存空间。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"页式存储管理和段式存储管理方式，均采用离散的内存分配方式，一个作业可以占用不连续的内存空间。","images":[],"tables":[]},{"num":180,"type":"judge","source":"","stem":"页是信息的物理单位，段是信息的逻辑单位。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"分页存储管理方式，能消减内存的外零头，提高内存的利用率，是系统的行为，仅仅是系统管理上的需要。而段通常包含的是一组意义相对完整的信息，分段的目的主要为了更好地满足用户的需要。","images":[],"tables":[]},{"num":181,"type":"judge","source":"","stem":"在段式存储管理系统中，段的大小受内存空间的限制。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"在段式存储管理系统中，段的大小受内存空间的限制。","images":[],"tables":[]},{"num":182,"type":"judge","source":"","stem":"动态重定位需要重定位寄存器的支持。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"在动态重定位中，为使地址的转换不会影响到指令的执行速度，必须有硬件地址变换机构的支持，即须在系统中增设一个重定位寄存器，用它来存放程序（数据）在内存中的起始地址。","images":[],"tables":[]},{"num":183,"type":"judge","source":"考研真题","stem":"在现代操作系统的支持下，允许程序装入一部分即可运行。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"部分程序装入即可运行，是实现虚拟存储器的前提。","images":[],"tables":[]},{"num":184,"type":"judge","source":"考研真题","stem":"请求分页存储管理系统中，若把页面的大小增加一倍，则缺页中断次数会减少50%。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"在请求分页存储管理系统中，由于页面尺寸增大，存在程序需要的页面数会减少，因此，缺页中断次数也会减少，但是没有比率关系。","images":[],"tables":[]},{"num":185,"type":"judge","source":"","stem":"一个虚拟存储器，其地址空间的大小等于辅存的容量加上主存的容量。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"虚拟存储器的大小和主存以及辅存的容量大小无关，只和虚地址的位数，或者说是CPU的地址空间有关。","images":[],"tables":[]},{"num":186,"type":"judge","source":"考研真题","stem":"在请求分页式存储管理中，页面的调入、调出只能在内存和对换区之间进行。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"请求分页系统的外存分为文件区和对换区两部分，所以也可能与文件区进行交换。","images":[],"tables":[]},{"num":187,"type":"judge","source":"","stem":"采用虚拟存储器技术，用户编写的应用程序的地址空间是连续的。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"程序在虚拟地址空间上是连续的，可以直接根据页号访问，而程序在物理内存中的分布则是离散的。","images":[],"tables":[]},{"num":188,"type":"judge","source":"","stem":"为了减少缺页中断率，页面应该小一些。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"页面大小通常是操作系统可以选择的一个参数。大页面要比小页面会保留更多无用程序在内存中。另一方面，小页面会增加页面数，加大页表。但是，页表的变大，会导致页表的缺页率增加。所以总的来说，页越小，缺页率不一定会越小。","images":[],"tables":[]},{"num":189,"type":"judge","source":"考研真题","stem":"虚拟存储的实现是基于程序访问的局部性原理，其实质是借助外存将内存较小的物理地址空间转化为较大的逻辑地址空间。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"基于局部性原理，将程序的一部分装入内存，就可以启动程序执行，而将其余部分保存在外存。在程序运行过程中，当所访问的信息不在内存时，由操作系统将所需的部分调入内存后，继续执行；另一方面，操作系统将内存中暂时不用的内容换出到外存上，腾出空间存放将要调入内存的信息。这样，系统好像为用户提供了一个比实际内存大得多的存储器，称为虚拟存储器。","images":[],"tables":[]},{"num":190,"type":"judge","source":"","stem":"在虚拟存储系统中，操作系统为用户提供了巨大的存储空间。因此，用户地址空间的大小可以不受任何限制。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"在虚拟存储系统中，用户所感觉到的内存容量会比实际内存容量大得多，但是，用户地址空间的大小仍然是受限制的，是由计算机的地址字长决定的。","images":[],"tables":[]},{"num":191,"type":"judge","source":"","stem":"为提高请求分页系统中内存的利用率，允许用户使用不同大小的页面。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"请求分页系统是在基本分页存储系统的基础上，增加了请求调入和页面置换两大功能，但是页面大小仍然相等。","images":[],"tables":[]},{"num":192,"type":"judge","source":"","stem":"磁带是一个独占型设备，任一时刻只能有一个用户使用；而磁盘是一个共享型设备，因此任一时刻允许有多个用户同时对它进行读/写操作。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"磁带是个独占设备，任一时刻只能有一个用户使用。磁盘是个共享设备，可以被不同用户或进程同时访问，在同一时刻对于读或写操作，可以不限制进程的数量。","images":[],"tables":[]},{"num":193,"type":"judge","source":"考研真题","stem":"每当中断处理完成后，都将返回被中断进程被中断处继续执行。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"中断须经历的步骤：保护CPU环境、分析中断原因、转入中断处理子程序、恢复CPU环境、继续执行中断进程。","images":[],"tables":[]},{"num":194,"type":"judge","source":"考研真题","stem":"通道所执行的通道程序存放在主机的内存中。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"A","answerText":"正确答案：正确","explanation":"通道没有自己的内存，通道所执行的通道程序放在主机的内存中，即通道与CPU共享内存。","images":[],"tables":[]},{"num":195,"type":"judge","source":"考研真题","stem":"在操作系统中，用户程序申请使用I/O设备时，通常使用逻辑设备名。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"为了实现设备独立性，当应用程序请求I/O设备时，应使用逻辑设备名。\n注：原题库将该题答案标注为“错误”，但其解析及通用教材均表明用户申请 I/O 设备时应使用逻辑设备名，故按“正确”判定。","images":[],"tables":[]},{"num":196,"type":"judge","source":"考研真题","stem":"为了实现设备的独立性，要求所有用户和用户进程必须使用不同的逻辑设备名。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"设备独立性指用户在程序中请求某类设备时，用逻辑设备名请求，在实际执行时要将逻辑设备名转换为对应的物理设备名。某类设备的逻辑设备名相同，但每一台设备都有各自的物理设备名。","images":[],"tables":[]},{"num":197,"type":"judge","source":"","stem":"用户是用逻辑设备名来申请使用设备的，所以通道也是按逻辑设备名来启动设备。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":"B","answerText":"正确答案：错误","explanation":"用户用逻辑设备名申请使用设备，但是，系统要为用户分配具体设备须建立逻辑设备名与物理设备名的对应关系，通道根据物理设备名控制具体设备。","images":[],"tables":[]},{"num":198,"type":"judge","source":"考研真题","stem":"就安全的设备分配方式而言，每当进程发出I/O请求后，便进入阻塞状态，直到对应I/O操作完成时才被唤醒。","options":[{"label":"A"
